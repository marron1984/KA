<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>吉田占いダッシュボード</title>
<style>
  /* === URANAI / Editorial — warm cream + handmade journal === */
  :root {
    --bg:     #f3ead6;            /* warm cream paper */
    --bg2:    #fffaec;            /* off-white card */
    --bg3:    #e8ddc1;            /* nested warm */
    --fg:     #2a2018;            /* warm dark brown (not pure black) */
    --fg2:    #3a2e22;
    --muted:  #8a7a64;
    --accent: #c0533f;            /* warm terracotta red */
    --accent2:#e8b347;            /* warm gold yellow */
    --good:   #6d8957;
    --mid:    #b08c44;
    --bad:    #a04832;
    --frog:   #a8c97a;
    --line:   #2a2018;
    --line2:  #d6c8a8;
    --serif:  "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Times New Roman", serif;
    --sans:   "Helvetica Neue", -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    --display:"Helvetica Neue", "Arial Black", -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    --hand:   "Klee One","Yuji Syuku","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--fg);
    min-height: 100vh;
    background: var(--bg);
    letter-spacing: 0.005em;
  }
  /* 紙のグレイン (フィルム風) */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0 0.09  0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.12;
    mix-blend-mode: multiply;
  }
  /* 内容はノイズより前面に */
  body > * { position: relative; z-index: 2; }
  /* ============== EDITORIAL HEADER (top nav) ============== */
  header.ed-nav {
    position: sticky; top: 0; z-index: 50;
    padding: 18px 40px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 32px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .ed-brand { display: flex; align-items: center; gap: 14px; flex-wrap: nowrap; }
  .ed-mascot {
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.4s cubic-bezier(0.22,0.61,0.36,1);
  }
  .ed-mascot svg { display: block; }
  .ed-mascot:hover { transform: rotate(-8deg) scale(1.08); }
  @keyframes frogBob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-2px); }
  }
  .ed-mascot { animation: frogBob 3.6s ease-in-out infinite; }

  /* 相性ビジュアル: ●●●●○ + ラベル + 数値 */
  .compat-vis {
    display: inline-flex; align-items: center; gap: 4px;
    line-height: 1;
  }
  .compat-vis .cdot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--bg3);
    border: 1px solid var(--line2);
    display: inline-block;
  }
  .compat-vis .cdot.on { background: var(--accent); border-color: var(--accent); }
  .compat-vis .clbl {
    margin-left: 6px;
    font-family: var(--serif);
    font-size: 13px;
    color: var(--fg);
    font-weight: 500;
  }
  .compat-vis .cnum {
    color: var(--muted);
    font-size: 10px;
    margin-left: 4px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
  }
  .compat-vis.tight .clbl { font-size: 12px; }
  .compat-vis.tight .cdot { width: 7px; height: 7px; }
  .compat-vis.big .cdot { width: 11px; height: 11px; }
  .compat-vis.big .clbl { font-size: 15px; font-weight: 600; }
  .ed-brand .ed-wordmark {
    font-family: var(--display);
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--fg);
    line-height: 1;
  }
  .ed-brand .ed-issue {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: var(--sans);
    white-space: nowrap;
  }
  .ed-tabs {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: nowrap;
    overflow-x: auto;
  }
  .ed-tab {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line2);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 12px; font-weight: 500;
    font-family: var(--sans);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
    letter-spacing: 0.05em;
  }
  .ed-tab:hover { background: var(--fg); color: #fff; }
  .ed-tab.active {
    background: var(--fg); color: #fff; border-color: var(--fg);
    box-shadow: 0 0 0 3px rgba(232, 179, 71, 0.45);
  }
  .ed-right { display: flex; gap: 8px; align-items: center; }
  .ed-right input[type=date] {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font-family: var(--sans);
    color-scheme: light; font-size: 12px;
  }
  .ed-right .btn {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; font-family: var(--sans);
    font-size: 13px; cursor: pointer;
    letter-spacing: 0;
    text-transform: none;
  }
  .ed-right .btn:hover { background: var(--fg); color: #fff; }
  .ed-editorial {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line2);
    border-radius: 999px;
    padding: 8px 18px 8px 12px;
    font-size: 12px; font-family: var(--sans);
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
  }
  .ed-editorial::before {
    content: ''; width: 14px; height: 14px;
    border-radius: 50%; border: 1px solid var(--fg);
    display: inline-block;
  }
  .date-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .date-bar input[type=date] {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line2); border-radius: 999px;
    padding: 8px 14px; font-family: var(--sans);
    color-scheme: light; font-size: 12px;
  }

  /* ============== HERO (cover) ============== */
  .ed-hero {
    padding: 40px 60px 28px;
    max-width: 1500px;
    margin: 0 auto;
    position: relative;
  }
  .ed-hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 36px;
  }
  .ed-date-pill {
    border: 1px solid var(--line2);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 14px;
    font-family: var(--serif);
    letter-spacing: 0.02em;
  }
  .ed-reading-tag {
    background: var(--fg);
    color: #fff;
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: var(--sans);
  }
  .ed-reading-tag .light { opacity: 0.55; margin-left: 6px; font-weight: 400; }
  .ed-headline {
    position: relative;
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(72px, 11vw, 168px);
    line-height: 0.92;
    letter-spacing: -0.035em;
    color: var(--fg);
    text-transform: uppercase;
    margin: 0;
  }
  .ed-headline .hl-line { display: block; }
  .ed-explore-stamp {
    position: absolute;
    top: 200px;
    right: 80px;
    width: 130px; height: 130px;
    border-radius: 50%;
    animation: rotate360 28s linear infinite;
  }
  .ed-explore-stamp svg { width: 100%; height: 100%; overflow: visible; }
  .ed-explore-stamp .star {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    animation: rotate360 28s linear infinite reverse;
  }
  .ed-explore-stamp .star-dot {
    width: 26px; height: 26px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--fg);
  }
  @media (max-width: 720px) {
    .ed-explore-stamp { width: 90px; height: 90px; top: 90px; right: 20px; }
  }
  .ed-tagline {
    margin-top: 36px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }
  .ed-tagline .ja-tag {
    font-family: var(--serif);
    font-size: clamp(22px, 2.6vw, 38px);
    line-height: 1.5;
    color: var(--fg);
    letter-spacing: 0.01em;
  }
  .ed-tagline .ja-tag .greet {
    display: block;
    margin-top: 6px;
  }
  .ed-tagline .ja-side {
    font-family: var(--sans);
    font-size: 11px;
    line-height: 1.7;
    color: var(--fg);
    letter-spacing: 0.12em;
    text-align: right;
  }
  .ed-tagline .ja-side .en {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    display: block;
  }
  .ed-tagline .ja-side .ja {
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  /* ============== INFO STRIP (5 cards under hero) ============== */
  .ed-strip {
    padding: 0 60px 60px;
    max-width: 1500px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .ed-strip > * { min-width: 0; }
  @media (max-width: 900px) {
    .ed-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .ed-hero { padding: 24px 20px 16px; }
    .ed-strip { padding: 0 20px 28px; }
  }
  .ed-strip-cell {
    padding: 20px 22px 26px;
    border-right: 1px solid var(--line);
    min-height: 110px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .ed-strip-cell:last-child { border-right: none; }
  .ed-strip-cell .label {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--fg);
    font-weight: 700;
    text-transform: uppercase;
  }
  .ed-strip-cell .label .ja { color: var(--muted); margin-left: 4px; font-weight: 500; letter-spacing: 0.08em; }
  .ed-strip-cell .val {
    font-family: var(--display);
    font-size: clamp(28px, 3vw, 40px);
    font-weight: 900;
    letter-spacing: -0.015em;
    color: var(--fg);
    line-height: 1;
  }
  .ed-strip-cell .val.small { font-size: clamp(22px, 2.4vw, 32px); }
  .ed-strip-cell .sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-top: auto;
  }
  .btn {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line2); border-radius: 0;
    padding: 8px 16px; cursor: pointer; font-family: var(--sans);
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
  }
  .btn:hover { background: var(--fg); color: var(--bg2); border-color: var(--fg); }
  .btn-primary { background: var(--fg); color: var(--bg2); border-color: var(--fg); font-weight: 500; }
  .btn-primary:hover { background: var(--bg2); color: var(--fg); }
  .btn-danger  { color: var(--bad); border-color: var(--bad); }
  .btn-danger:hover { background: var(--bad); color: var(--bg2); border-color: var(--bad); }
  main {
    display: grid;
    grid-template-columns: minmax(440px, 1fr) 400px;
    gap: 24px;
    padding: 40px 60px 80px;
    max-width: 1500px;
    margin: 0 auto;
  }
  @media (max-width: 1000px) { main { grid-template-columns: minmax(0, 1fr); padding: 20px; } }
  .panel {
    background: var(--bg2);
    border: 1px solid var(--line2);
    border-radius: 0;
    padding: 28px;
    min-width: 0;
    overflow: hidden;
  }
  .panel-wide { grid-column: 1 / -1; }
  .panel h2 {
    margin: 0 0 16px;
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line2);
  }
  .radial-wrap { aspect-ratio: 1 / 1; width: 100%; }
  svg { width: 100%; height: 100%; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  /* viewer-perspective chips */
  .viewer-bar {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 10px;
    margin: 0 0 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line2);
    min-width: 0;
  }
  .viewer-bar .vlabel {
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted);
    flex-shrink: 0;
  }
  .viewer-nav {
    display: flex; gap: 4px; flex-shrink: 0;
  }
  .viewer-nav button {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line2);
    border-radius: 999px;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 14px; line-height: 1;
    transition: background 0.18s, color 0.18s, border-color 0.18s;
  }
  .viewer-nav button:hover { background: var(--fg); color: #fff; border-color: var(--fg); }
  .viewer-nav button:disabled { opacity: 0.25; cursor: not-allowed; }
  .viewer-chips {
    display: flex; gap: 6px;
    overflow-x: auto;
    flex-wrap: nowrap;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 4px 2px;
    scroll-behavior: smooth;
    min-width: 0;
  }
  .viewer-chips::-webkit-scrollbar { display: none; }
  .vc-chip {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line2);
    padding: 8px 14px 8px 12px;
    cursor: pointer;
    font-family: var(--serif); font-size: 13px;
    border-radius: 999px;
    transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
    scroll-snap-align: start;
    display: inline-flex; align-items: center; gap: 8px;
    position: relative;
  }
  .vc-chip:hover { border-color: var(--fg); }
  .vc-chip.active {
    background: var(--fg); color: #fff; border-color: var(--fg);
    box-shadow: 0 0 0 4px rgba(232, 179, 71, 0.4);
  }
  .vc-chip.active::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: -2px;
  }
  .vc-chip .vc-score {
    font-family: var(--sans);
    font-size: 10px; font-weight: 700;
    background: var(--bg3); color: var(--fg);
    border-radius: 999px;
    padding: 2px 6px;
    letter-spacing: 0;
  }
  .vc-chip.active .vc-score { background: rgba(255,255,255,0.18); color: #fff; }
  .vc-chip .vc-mini {
    font-size: 9px; letter-spacing: 0.18em; opacity: 0.55;
    font-family: var(--sans); text-transform: uppercase;
  }
  /* compat matrix */
  .compat-matrix {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px;
    background: var(--line); border: 1px solid var(--line2);
    margin-top: 14px;
    min-width: 0;
  }
  .cm-row {
    display: contents;
  }
  .cm-row .cm-name, .cm-row .cm-val {
    background: var(--bg2); padding: 8px 12px;
    font-size: 12px;
  }
  .cm-row .cm-val { text-align: right; font-family: var(--serif); font-size: 14px; }
  .cm-row .cm-name .nm-sub { color: var(--muted); font-size: 10px; margin-left: 4px; letter-spacing: 0.05em; }
  .cards { display: flex; flex-direction: column; gap: 1px; max-height: 640px; overflow-y: auto; background: var(--line2); }
  .card {
    background: var(--bg2);
    border: none;
    border-radius: 0;
    padding: 14px 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .card:hover { background: var(--bg3); }
  .card.selected { background: var(--fg); color: var(--bg2); }
  .card.selected .card-role,
  .card.selected .bar,
  .card.selected .bar-val,
  .card.selected .card-foot { color: rgba(255,255,255,0.75); }
  .card.selected .bar-track { background: rgba(255,255,255,0.15); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .card-name { font-family: var(--serif); font-weight: 500; font-size: 17px; letter-spacing: 0.02em; }
  .card-role { font-size: 10px; color: var(--muted); margin-left: 8px; letter-spacing: 0.05em; }
  .card-score { font-family: var(--serif); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .bars { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .bar { display: grid; grid-template-columns: 38px 1fr 26px; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
  .bar-track { height: 1px; background: var(--line); border-radius: 0; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 0; transition: width 0.4s ease; }
  .bar-val { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; font-family: var(--serif); }
  .card-foot { margin-top: 6px; font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
  .card-oneliners {
    margin-top: 10px;
    padding: 12px 14px 10px;
    background: var(--bg3);
    border-left: 2px solid var(--accent);
    position: relative;
  }
  .card-oneliner {
    font-family: var(--serif);
    font-size: 13.5px;
    line-height: 1.55;
    padding: 6px 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 10px;
  }
  .card-oneliner + .card-oneliner {
    border-top: 1px dashed var(--line2);
    margin-top: 2px;
  }
  .card-oneliner .ol-arrow {
    font-size: 9px; letter-spacing: 0.15em; color: var(--muted);
    text-transform: uppercase; align-self: start; padding-top: 4px;
    font-family: var(--sans); font-weight: 700;
  }
  .card-oneliner .ol-body { display: flex; flex-direction: column; gap: 4px; }
  .card-oneliner .ol-text { color: var(--fg); }
  .card-oneliner .ol-cat {
    display: inline-block;
    align-self: flex-start;
    font-size: 9px; letter-spacing: 0.15em;
    background: var(--bg2); color: var(--muted);
    border: 1px solid var(--line2);
    padding: 2px 8px; border-radius: 999px;
    font-family: var(--sans); text-transform: uppercase;
  }
  .card-oneliners .ol-tone-note {
    margin-top: 6px;
    font-size: 10px; color: var(--muted);
    font-family: var(--sans); letter-spacing: 0.05em;
    text-align: right;
  }
  .ol-refresh {
    position: absolute; top: 8px; right: 8px;
    width: 26px; height: 26px;
    border-radius: 50%; border: 1px solid var(--line2);
    background: var(--bg2); color: var(--muted);
    font-size: 13px; cursor: pointer;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.5s cubic-bezier(0.22,0.61,0.36,1), background 0.2s, color 0.2s, border-color 0.2s;
    z-index: 2;
  }
  .ol-refresh:hover {
    background: var(--accent); color: #fff; border-color: var(--accent);
    transform: rotate(180deg);
  }
  .ol-refresh:active { transform: rotate(360deg) scale(0.9); }
  .card.selected .card-oneliners { background: rgba(255,255,255,0.08); border-left-color: var(--accent2); }
  .card.selected .card-oneliner .ol-text { color: rgba(255,255,255,0.95); }
  .card.selected .card-oneliner .ol-cat { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.2); }
  .card.selected .ol-tone-note { color: rgba(255,255,255,0.55); }
  .card.selected .card-oneliner .ol-arrow { color: rgba(255,255,255,0.55); }
  .card.selected .ol-refresh { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); border-color: rgba(255,255,255,0.2); }
  /* Tabs */
  .tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
    flex-wrap: wrap;
    min-width: 0;
    max-width: 100%;
  }
  .tab {
    background: none; border: none;
    color: var(--muted);
    padding: 12px 18px; cursor: pointer;
    font-family: var(--sans);
    font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase;
    border-bottom: 1px solid transparent;
    margin-bottom: -1px;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--fg); }
  .tab-panel { display: none; min-width: 0; }
  .tab-panel.active { display: block; }
  /* Grid layouts within tabs */
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
  .grid-2 > *, .grid-3 > * { min-width: 0; }
  .box {
    background: var(--bg2);
    border: 1px solid var(--line2);
    border-radius: 0; padding: 22px;
  }
  .box h3 {
    margin: 0 0 16px;
    font-family: var(--serif);
    font-size: 18px; color: var(--fg);
    font-weight: 500; letter-spacing: 0.02em;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line2);
  }
  .box h4 {
    margin: 16px 0 8px;
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.2em;
    font-weight: 500;
  }
  .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; gap: 8px; border-bottom: 1px dotted var(--line2); }
  .row:last-child { border-bottom: none; }
  .row > span:first-child { color: var(--muted); flex-shrink: 0; font-size: 11px; letter-spacing: 0.05em; }
  .row > span:last-child { text-align: right; font-family: var(--serif); }
  .pillar-table {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1px; margin: 14px 0;
    background: var(--line);
    border: 1px solid var(--line2);
    min-width: 0;
  }
  .pillar-cell {
    background: var(--bg2); padding: 14px 6px; border-radius: 0;
    text-align: center; font-size: 12px;
  }
  .pillar-cell .pillar-label {
    color: var(--muted); font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase;
    font-family: var(--sans);
  }
  .pillar-cell .pillar-stem {
    font-family: var(--serif);
    font-size: 30px; font-weight: 400; color: var(--fg);
    display: block; margin-top: 8px;
  }
  .pillar-cell .pillar-branch {
    font-family: var(--serif);
    font-size: 30px; font-weight: 400; color: var(--fg2);
    display: block;
  }
  .pillar-cell .pillar-meta {
    font-size: 9px; color: var(--muted);
    margin-top: 6px; line-height: 1.5;
    font-family: var(--sans);
  }
  .chip {
    background: var(--bg3);
    color: var(--fg);
    padding: 4px 12px; border-radius: 0;
    font-size: 10px; letter-spacing: 0.1em;
    display: inline-block; margin: 2px;
    border: 1px solid var(--line2);
  }
  .chip-mini {
    background: var(--bg3); color: var(--fg);
    padding: 3px 8px; border-radius: 0;
    font-size: 10px; margin: 2px;
    display: inline-block;
    border: 1px solid var(--line2);
    font-family: var(--sans);
    letter-spacing: 0.05em;
  }
  .advice {
    margin-top: 14px; padding: 14px 16px;
    background: var(--bg3);
    border-left: 2px solid var(--fg);
    border-radius: 0;
    font-size: 13px; line-height: 1.8;
    font-family: var(--serif);
  }
  .narrative {
    font-size: 13px; line-height: 1.85; color: var(--fg);
    background: var(--bg2);
    padding: 16px 18px; border-radius: 0;
    border: 1px solid var(--line2);
    margin-bottom: 12px;
    font-family: var(--serif);
  }
  .narrative h4 {
    margin: 0 0 8px;
    color: var(--fg); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.2em;
    font-weight: 500;
    font-family: var(--sans);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line2);
  }
  /* Hexagram lines */
  .hex { display: flex; flex-direction: column-reverse; gap: 6px; align-items: center; }
  .hex-line {
    width: 90px; height: 8px; background: var(--fg); border-radius: 0;
    position: relative;
  }
  .hex-line.yin {
    background: transparent;
    box-shadow: -24px 0 0 var(--fg), 24px 0 0 var(--fg);
    width: 38px; height: 8px;
  }
  .hex-line.changing { background: var(--bad); }
  .hex-line.yin.changing { box-shadow: -24px 0 0 var(--bad), 24px 0 0 var(--bad); }
  /* Tarot */
  .tarot-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .tarot-card {
    background: var(--bg2);
    border: 1px solid var(--fg);
    border-radius: 0;
    width: 120px; padding: 14px 10px;
    text-align: center; font-size: 11px;
    box-shadow: 6px 6px 0 var(--line);
    color: var(--fg);
  }
  .tarot-card.reversed { transform: rotate(180deg); }
  .tarot-card .pos { color: var(--muted); font-size: 9px; letter-spacing: 0.2em; margin-bottom: 6px; text-transform: uppercase; }
  .tarot-card .name { font-family: var(--serif); font-size: 14px; font-weight: 500; margin: 8px 0; letter-spacing: 0.02em; }
  .tarot-card .suit { color: var(--muted); font-size: 9px; letter-spacing: 0.1em; }
  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,20,20,0.55);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--line2);
    border-radius: 0; padding: 32px;
    width: min(560px, 92vw); max-height: 88vh; overflow-y: auto;
  }
  .modal h2 {
    margin: 0 0 22px;
    font-family: var(--serif);
    font-size: 22px; font-weight: 500;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line2);
  }
  .modal-section { margin-bottom: 24px; }
  .modal-section h3 {
    font-size: 10px; color: var(--muted); margin: 0 0 12px;
    text-transform: uppercase; letter-spacing: 0.25em; font-weight: 500;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 14px; }
  .form-grid label.full { grid-column: 1 / -1; }
  .form-grid label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.15em; text-transform: uppercase;
  }
  .form-grid input, .form-grid select {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line2); border-radius: 0;
    padding: 10px 12px; font-family: var(--sans);
    font-size: 14px; color-scheme: light;
    text-transform: none; letter-spacing: 0;
  }
  .form-grid input:focus, .form-grid select:focus {
    outline: none; border-color: var(--fg);
  }
  .blood-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .blood-group input { display: none; }
  .blood-group label {
    text-align: center; padding: 10px; border: 1px solid var(--line2);
    border-radius: 0; cursor: pointer; font-weight: 500;
    color: var(--fg); font-size: 13px;
    font-family: var(--serif);
    letter-spacing: 0;
    text-transform: none;
  }
  .blood-group input:checked + label {
    background: var(--fg); color: var(--bg2); border-color: var(--fg);
  }
  .check-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; margin-top: 4px;
    color: var(--fg);
    text-transform: none; letter-spacing: 0.02em;
  }
  .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
  .modal-actions .left, .modal-actions .right { display: flex; gap: 8px; }
  .people-list { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; }
  .person-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
    padding: 10px 12px; background: var(--bg3);
    border: 1px solid var(--line2);
    border-radius: 0; font-size: 13px;
  }
  .person-row .meta { color: var(--muted); font-size: 10px; letter-spacing: 0.05em; }
  .person-row .ico-btn {
    background: none; border: 1px solid var(--line2);
    color: var(--muted);
    cursor: pointer; padding: 4px 10px;
    font-size: 13px; border-radius: 0;
  }
  .person-row .ico-btn:hover {
    color: var(--bg2); background: var(--fg); border-color: var(--fg);
  }
  .center-badge {
    display: inline-block; background: var(--fg); color: var(--bg2);
    padding: 2px 8px; border-radius: 0;
    font-size: 9px; margin-left: 6px;
    letter-spacing: 0.15em; text-transform: uppercase;
    font-family: var(--sans);
  }
  /* SVG text */
  .node-label { font-family: var(--serif); font-size: 14px; fill: var(--fg); text-anchor: middle; pointer-events: none; font-weight: 500; }
  .node-sub { font-family: var(--sans); font-size: 9px; fill: var(--muted); text-anchor: middle; pointer-events: none; letter-spacing: 0.05em; }
  .node-score { font-family: var(--serif); font-size: 14px; font-weight: 400; text-anchor: middle; pointer-events: none; fill: var(--fg); }
  .link { fill: none; stroke-width: 1; opacity: 0.7; }
  .node-circle { cursor: pointer; transition: r 0.2s; }
  .node-circle.selected { stroke: var(--fg); stroke-width: 2; }
  /* "Focus mode" hero footer (4WIDE-inspired) */
  .hero-foot {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 24px; padding: 32px 0 8px;
    border-top: 1px solid var(--line);
    font-family: var(--serif);
  }
  .hero-foot .hero-tag {
    font-size: 48px; line-height: 1; letter-spacing: 0.02em;
    color: var(--fg); font-weight: 400;
  }
  .hero-foot .hero-tag .small { font-size: 16px; letter-spacing: 0.2em; color: var(--muted); display: block; margin-bottom: 8px; font-family: var(--sans); text-transform: uppercase; }
  .hero-foot .hero-meta {
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.15em;
    font-family: var(--sans);
    text-align: right;
    line-height: 1.8;
  }
  @media (max-width: 720px) {
    h1 { font-size: 24px; }
    main { padding: 20px; }
    .hero-foot .hero-tag { font-size: 32px; }
  }

  /* ===================== Motion ===================== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ============ JP-cutting-edge motion layer ============ */
  /* 文字スプリット (見出しの一文字遅延フェード) */
  @keyframes letterRise {
    from { opacity: 0; transform: translateY(0.5em) rotate(-2deg); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0)     rotate(0);     filter: blur(0); }
  }
  .ed-headline .hl-char {
    display: inline-block;
    opacity: 0;
    animation: letterRise 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    will-change: opacity, transform, filter;
  }
  .ed-headline .hl-line { overflow: hidden; padding-bottom: 0.05em; }

  /* スクロール連動リビール — IntersectionObserver で .is-in を付与 */
  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition:
      opacity 0.9s cubic-bezier(0.22, 0.61, 0.36, 1),
      transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: opacity, transform;
  }
  .reveal.is-in { opacity: 1; transform: translateY(0); }
  .reveal-stagger > * { transition-delay: calc(var(--i, 0) * 60ms); }

  /* スコアのカウントアップ用 nudge */
  .ed-strip-cell .val,
  .card-score,
  .vc-score,
  .gauge-num,
  .cm-val {
    font-variant-numeric: tabular-nums;
  }

  /* マグネティックホバー対応 (translate を JS から付与) */
  .ed-tab, .vc-chip, .btn, .ed-reading-tag, .ed-date-pill {
    transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1), background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.3s;
  }

  /* カーソルチェイサー (PCのみ) */
  .cursor-chaser {
    position: fixed; top: 0; left: 0;
    width: 8px; height: 8px;
    pointer-events: none; z-index: 9999;
    background: var(--accent);
    border-radius: 50%;
    mix-blend-mode: difference;
    opacity: 0;
    transition: opacity 0.4s, transform 0.18s cubic-bezier(0.22, 0.61, 0.36, 1), width 0.25s, height 0.25s;
    transform: translate(-50%, -50%);
  }
  .cursor-chaser.is-hot {
    width: 32px; height: 32px;
    background: rgba(232, 179, 71, 0.4);
  }
  @media (hover: none), (pointer: coarse) { .cursor-chaser { display: none !important; } }

  /* タブ・ピルのアンダーラインスライド (active 状態の滑らかな移動) */
  .tab { position: relative; }
  .tab::after {
    content: '';
    position: absolute; left: 12%; right: 12%; bottom: -1px;
    height: 1px;
    background: var(--fg);
    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .tab.active::after { transform: scaleX(1); }
  .tab.active { border-bottom-color: transparent !important; }

  /* クリック波紋 (body直下の固定位置で再描画の影響を受けない) */
  .click-ripple {
    position: fixed; border-radius: 50%;
    background: rgba(232, 179, 71, 0.6);
    pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%) scale(0); opacity: 0.85;
    animation: ripple 0.75s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    mix-blend-mode: multiply;
  }
  @keyframes ripple {
    to { transform: translate(-50%, -50%) scale(14); opacity: 0; }
  }

  /* ========== OPENING (温かみのある幕→分割) ========== */
  .opening-curtain {
    position: fixed; inset: 0; z-index: 100000;
    background: var(--fg);
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    clip-path: inset(0 0 0 0);
  }
  .opening-curtain::after {
    content: ''; position: absolute; inset: 0;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.7  0 0 0 0 0.6  0 0 0 0 0.4  0 0 0 0.4 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.18; mix-blend-mode: overlay;
    pointer-events: none;
  }
  .opening-curtain.is-out {
    animation: curtainSplit 1.0s cubic-bezier(0.77,0,0.18,1) forwards;
  }
  @keyframes curtainSplit {
    0%   { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(50% 0 50% 0); }
  }
  .opening-mark {
    font-family: var(--display);
    color: var(--bg);
    font-weight: 900;
    font-size: clamp(60px, 14vw, 200px);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    opacity: 0;
    animation: openingMark 1.05s cubic-bezier(0.22,0.61,0.36,1) both;
  }
  @keyframes openingMark {
    0%   { opacity: 0; letter-spacing: 1.2em; filter: blur(8px); }
    35%  { opacity: 1; letter-spacing: 0.35em; filter: blur(0); }
    100% { opacity: 0; letter-spacing: -0.05em; transform: scale(1.08); filter: blur(2px); }
  }
  .opening-meta {
    position: absolute;
    bottom: 36px; left: 36px;
    color: var(--bg); opacity: 0;
    font-family: var(--sans); font-size: 11px;
    letter-spacing: 0.35em; text-transform: uppercase;
    animation: openingMeta 1.0s ease both 0.15s;
  }
  .opening-meta-r {
    position: absolute;
    bottom: 36px; right: 36px;
    color: var(--bg); opacity: 0;
    font-family: var(--sans); font-size: 11px;
    letter-spacing: 0.35em; text-transform: uppercase;
    animation: openingMeta 1.0s ease both 0.25s;
  }
  @keyframes openingMeta {
    0%   { opacity: 0; transform: translateY(20px); }
    30%  { opacity: 0.65; transform: translateY(0); }
    100% { opacity: 0; }
  }

  /* ========== MARQUEE (情報帯下に高速流れる帯) ========== */
  .marquee {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    overflow: hidden;
    background: var(--bg);
    position: relative;
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(20px, 3vw, 42px);
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--fg);
    user-select: none;
  }
  .marquee.invert {
    background: var(--fg); color: var(--bg);
    border-color: var(--fg);
  }
  .marquee-inner {
    display: flex;
    white-space: nowrap;
    animation: marqueeRoll 28s linear infinite;
    will-change: transform;
  }
  .marquee.reverse .marquee-inner { animation-direction: reverse; }
  .marquee-block { display: inline-flex; align-items: center; padding-right: 0; }
  .marquee-block .mq-item { padding: 0 28px; }
  .marquee-block .mq-dot {
    display: inline-block;
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 50%;
    margin: 0 2px;
    flex-shrink: 0;
  }
  .marquee.invert .mq-dot { background: var(--accent); }
  @keyframes marqueeRoll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .marquee:hover .marquee-inner { animation-play-state: paused; }

  /* ========== MOUSE SPOTLIGHT (黄色オーラ追従) ========== */
  .mouse-spotlight {
    position: fixed; pointer-events: none; z-index: 2;
    width: 640px; height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232, 179, 71, 0.22) 0%, rgba(232, 179, 71, 0) 65%);
    transform: translate(-9999px, -9999px);
    mix-blend-mode: multiply;
    opacity: 0;
    transition: opacity 0.5s;
    will-change: transform;
  }
  .mouse-spotlight.is-on { opacity: 1; }
  @media (hover: none), (pointer: coarse) { .mouse-spotlight { display: none; } }

  /* ========== CLICK STAR BURST (★が5方向に飛ぶ) ========== */
  .click-star {
    position: fixed; pointer-events: none; z-index: 9999;
    width: 14px; height: 14px;
    transform: translate(-50%, -50%);
    color: var(--fg);
    font-size: 14px; line-height: 1;
    font-family: var(--sans);
    will-change: transform, opacity;
  }
  .click-star.is-yellow { color: var(--accent); }
  .click-star::before { content: '+'; font-weight: 900; }
  @keyframes starFly {
    0%   { transform: translate(-50%, -50%) translate(0, 0) scale(1) rotate(0); opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--fx), var(--fy)) scale(0.3) rotate(720deg); opacity: 0; }
  }

  /* ========== Parallax targets (transform 設定は JS から) ========== */
  .ed-headline { will-change: transform; }
  .ed-explore-stamp { will-change: transform; }

  /* ヘッドラインのゴーストレイヤ (薄黄色オフセット) */
  .ed-headline { position: relative; isolation: isolate; }
  .ed-headline::before {
    content: attr(data-ghost);
    position: absolute; inset: 0;
    color: rgba(232, 179, 71, 0.85);
    transform: translate(10px, 8px);
    text-transform: uppercase;
    font-weight: 900;
    letter-spacing: -0.035em;
    line-height: 0.92;
    white-space: pre-line;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }
  .ed-headline .hl-line { position: relative; z-index: 1; }
  @media (max-width: 720px) {
    .ed-headline::before { transform: translate(4px, 3px); }
  }

  /* Hero 全体の微妙なskew (アグレッシブ感) */
  .ed-hero { position: relative; }
  .ed-hero::after {
    content: ''; position: absolute;
    left: 0; right: 0; bottom: -1px; height: 1px;
    background: var(--accent);
    transform-origin: left;
    animation: heroLine 1.4s cubic-bezier(0.77, 0, 0.18, 1) both 0.8s;
    z-index: 5;
  }
  @keyframes heroLine {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  /* ヘッドライン周辺の薄いノイズ (微細な動き) — 視認できないほどに */
  @keyframes shimmer {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1; }
  }
  .ed-explore-stamp { box-shadow: 0 0 0 1px rgba(0,0,0,0.05); animation: rotate360 28s linear infinite, shimmer 6s ease-in-out infinite; }

  /* 数値・スコアの色が変わる時の滑らかな遷移 */
  .card-score, .vc-score, .cm-val, .ed-strip-cell .val { transition: color 0.5s ease; }

  /* スコアバー — 既存の barFill を更に味付け */
  .bar-fill { will-change: width; transition: width 0.9s cubic-bezier(0.22, 0.61, 0.36, 1), background 0.4s; }

  /* ed-strip セルのホバー: 文字がほんの少し前進 */
  .ed-strip-cell .val,
  .ed-strip-cell .label,
  .ed-strip-cell .sub { transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1), color 0.4s; }
  .ed-strip-cell:hover .val { transform: translateY(-2px); }
  .ed-strip-cell:hover .sub { color: var(--fg); }

  /* ヒーロー上部の date-pill / reading-tag に Hover 微浮き */
  .ed-date-pill:hover, .ed-reading-tag:hover { transform: translateY(-2px); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes rotate360 {
    from { transform: rotate(0deg); } to { transform: rotate(360deg); }
  }
  @keyframes pulseRing {
    0%   { transform: scale(1);    opacity: 0.7; }
    70%  { transform: scale(1.4);  opacity: 0; }
    100% { transform: scale(1.4);  opacity: 0; }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.04); }
  }
  @keyframes barFill {
    from { width: 0% !important; }
  }
  @keyframes dashFlow {
    to { stroke-dashoffset: -40; }
  }
  @keyframes gaugeFill {
    from { stroke-dashoffset: var(--gauge-len, 440); }
  }
  @keyframes drift {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: var(--p-op, 0.4); }
    90%  { opacity: var(--p-op, 0.4); }
    100% { transform: translate(60px, -120vh); opacity: 0; }
  }

  header { animation: fadeIn 0.6s ease both; }
  .panel { animation: fadeUp 0.7s cubic-bezier(0.2,0.8,0.2,1) both; }
  .panel:nth-child(2) { animation-delay: 0.10s; }
  .panel:nth-child(3) { animation-delay: 0.20s; }
  .hero-foot { animation: fadeUp 0.9s cubic-bezier(0.2,0.8,0.2,1) both; animation-delay: 0.3s; }
  .card { animation: fadeUp 0.5s ease both; }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.10s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.20s; }
  .card:nth-child(5) { animation-delay: 0.25s; }
  .card:nth-child(6) { animation-delay: 0.30s; }
  .card:nth-child(7) { animation-delay: 0.35s; }
  .card { transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease; }
  .card:hover { transform: translateX(4px); box-shadow: -4px 0 0 var(--fg); }
  .tab-panel.active { animation: fadeIn 0.4s ease both; }
  .box { animation: fadeUp 0.55s ease both; }

  .bar-fill { animation: barFill 0.9s cubic-bezier(0.2,0.8,0.2,1) both; }

  /* tarot card hover lift */
  .tarot-card { transition: transform 0.4s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.4s ease; }
  .tarot-card:hover { transform: translateY(-6px) rotate(-1deg); box-shadow: 10px 10px 0 var(--line); }
  .tarot-card.reversed:hover { transform: rotate(180deg) translateY(-6px) rotate(-1deg); }

  /* radial SVG decorative rings rotate slowly */
  .ring-rotate-cw  { transform-origin: 300px 300px; animation: rotate360 240s linear infinite; }
  .ring-rotate-ccw { transform-origin: 300px 300px; animation: rotate360 360s linear infinite reverse; }

  /* relationship links: flowing dashed line */
  .link.flowing { stroke-dasharray: 6 4; animation: dashFlow 2s linear infinite; }

  /* selected node pulse */
  .pulse-ring { animation: pulseRing 2.4s ease-out infinite; transform-origin: center; transform-box: fill-box; }

  /* score gauge */
  .gauge-wrap { position: relative; display: inline-block; }
  .gauge-svg .gauge-fg {
    transition: stroke-dashoffset 1.1s cubic-bezier(0.2,0.8,0.2,1), stroke 0.4s;
    transform: rotate(-90deg); transform-origin: center;
  }
  .gauge-wrap .gauge-num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 56px; font-weight: 400; color: var(--fg);
    pointer-events: none;
    animation: scaleIn 0.5s ease both;
  }
  .gauge-wrap .gauge-cap {
    position: absolute; bottom: 4px; left: 0; right: 0;
    text-align: center; font-size: 9px;
    letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted);
    pointer-events: none;
  }

  /* moon breathes */
  .moon-svg { animation: breathe 6s ease-in-out infinite; }

  /* hex lines stagger in */
  .hex .hex-line { animation: scaleIn 0.4s ease both; }
  .hex .hex-line:nth-child(1) { animation-delay: 0.05s; }
  .hex .hex-line:nth-child(2) { animation-delay: 0.10s; }
  .hex .hex-line:nth-child(3) { animation-delay: 0.15s; }
  .hex .hex-line:nth-child(4) { animation-delay: 0.20s; }
  .hex .hex-line:nth-child(5) { animation-delay: 0.25s; }
  .hex .hex-line:nth-child(6) { animation-delay: 0.30s; }
  .hex .hex-line.changing { animation: scaleIn 0.4s ease both, breathe 1.6s ease-in-out infinite 0.5s; }

  /* compass slow rotate */
  .compass-svg { animation: fadeIn 0.8s ease both; }
  .compass-svg .compass-needle { transform-origin: center; transition: transform 1s cubic-bezier(0.2,0.8,0.2,1); }

  /* particles overlay (浮遊する点) */
  .particles {
    pointer-events: none; position: fixed; inset: 0; z-index: 1;
    overflow: hidden;
  }
  .particles .p {
    position: absolute; width: 3px; height: 3px;
    background: var(--fg); border-radius: 50%;
    opacity: 0; animation: drift linear infinite;
  }

  /* WORDS feature */
  .words-hero {
    text-align: center;
    padding: 20px 0 28px;
    border-bottom: 1px solid var(--line2);
    margin-bottom: 28px;
  }
  .words-hero .wh-label {
    font-size: 9px; letter-spacing: 0.35em; color: var(--muted);
    text-transform: uppercase;
  }
  .words-hero .wh-title {
    font-family: var(--serif); font-size: 28px;
    margin-top: 10px; letter-spacing: 0.04em;
  }
  .words-hero .wh-sub {
    font-size: 11px; color: var(--muted); margin-top: 6px;
    letter-spacing: 0.1em;
  }
  .words-cols {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px;
  }
  .words-cols > * { min-width: 0; }
  @media (max-width: 720px) { .words-cols { grid-template-columns: minmax(0, 1fr); } }
  .words-col .wc-head {
    font-family: var(--serif); font-size: 18px;
    margin: 0 0 14px; padding-bottom: 10px;
    border-bottom: 1px solid var(--line2);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .words-col.want   .wc-head { color: var(--good); }
  .words-col.avoid  .wc-head { color: var(--bad); }
  .words-col .wc-head .wc-mini {
    font-size: 9px; color: var(--muted); letter-spacing: 0.3em;
    font-family: var(--sans); text-transform: uppercase;
  }
  .word-list { display: flex; flex-direction: column; gap: 8px; }
  .word-card {
    background: var(--bg2);
    border: 1px solid var(--line2);
    padding: 12px 16px;
    font-family: var(--serif);
    font-size: 15px;
    line-height: 1.55;
    position: relative;
    animation: fadeUp 0.45s ease both;
  }
  .word-card.want  { border-left: 3px solid var(--good); }
  .word-card.avoid { border-left: 3px solid var(--bad); }
  .word-card .wc-quote-l, .word-card .wc-quote-r {
    color: var(--muted); font-size: 18px;
    margin: 0 3px;
  }
  .word-card .wc-cat {
    display: block;
    font-size: 9px; letter-spacing: 0.25em;
    color: var(--muted); margin-top: 8px;
    text-transform: uppercase;
    font-family: var(--sans);
  }
  .word-card:nth-child(1) { animation-delay: 0.02s; }
  .word-card:nth-child(2) { animation-delay: 0.05s; }
  .word-card:nth-child(3) { animation-delay: 0.08s; }
  .word-card:nth-child(4) { animation-delay: 0.11s; }
  .word-card:nth-child(5) { animation-delay: 0.14s; }
  .word-card:nth-child(6) { animation-delay: 0.17s; }
  .word-card:nth-child(7) { animation-delay: 0.20s; }
  .word-card:nth-child(8) { animation-delay: 0.23s; }
  .words-controls {
    display: flex; gap: 10px;
    margin-top: 24px; padding-top: 20px;
    border-top: 1px solid var(--line2);
    align-items: center; flex-wrap: wrap;
  }
  .words-controls .wc-label {
    font-size: 9px; letter-spacing: 0.3em;
    color: var(--muted); text-transform: uppercase;
    margin-right: 6px;
  }
  .cat-chip {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line2); padding: 5px 12px;
    font-size: 11px; cursor: pointer;
    font-family: var(--sans); letter-spacing: 0.05em;
    transition: background 0.2s, color 0.2s;
  }
  .cat-chip:hover { border-color: var(--fg); }
  .cat-chip.active { background: var(--fg); color: var(--bg2); border-color: var(--fg); }
  .words-browse {
    margin-top: 20px;
  }
  .words-browse .wb-head {
    font-family: var(--serif); font-size: 14px;
    margin: 24px 0 10px; color: var(--fg);
  }
  .words-stats {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-top: 14px; font-size: 10px; color: var(--muted);
    letter-spacing: 0.1em;
  }
  /* nav transitions */
  .btn { transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s; }
  .btn:active { transform: scale(0.96); }
  .tab { transition: color 0.2s, border-color 0.25s; }
  .blood-group label { transition: background 0.2s, color 0.2s, border-color 0.2s; }

  /* =====================================================
     MOBILE — phone-first interface (≤720px)
     ===================================================== */
  @media (max-width: 720px) {
    /* --- HEADER (2 row: brand row + nav row) --- */
    header.ed-nav {
      display: flex; flex-direction: column;
      padding: 10px 14px;
      gap: 8px;
      position: sticky; top: 0;
    }
    .ed-brand {
      width: 100%;
      justify-content: space-between;
      align-items: center;
    }
    .ed-brand .ed-wordmark { font-size: 18px; }
    .ed-brand .ed-issue { font-size: 9px; letter-spacing: 0.12em; }
    .ed-tabs {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      justify-content: flex-start;
      margin: 0 -14px;
      padding: 4px 14px;
      gap: 5px;
    }
    .ed-tabs::-webkit-scrollbar { display: none; }
    .ed-tab { padding: 7px 13px; font-size: 11px; }
    .ed-right {
      width: 100%;
      justify-content: space-between;
      gap: 6px;
    }
    .ed-right .btn {
      padding: 7px 0;
      min-width: 36px; min-height: 36px;
      font-size: 13px;
      flex: 1;
    }
    .ed-right input[type=date] {
      flex: 2;
      font-size: 12px;
      padding: 7px 10px;
    }
    .ed-editorial { display: none; }

    /* --- HERO --- */
    .ed-hero { padding: 18px 16px 14px; }
    .ed-hero-top {
      margin-bottom: 18px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ed-date-pill { padding: 7px 14px; font-size: 12px; }
    .ed-reading-tag { padding: 7px 14px; font-size: 10px; letter-spacing: 0.1em; }
    .ed-headline {
      font-size: clamp(44px, 13.5vw, 88px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }
    .ed-explore-stamp {
      width: 76px; height: 76px;
      top: auto; bottom: 80px; right: 12px;
    }
    .ed-explore-stamp .star-dot { width: 20px; height: 20px; font-size: 11px; }
    .ed-explore-stamp text { font-size: 22px !important; letter-spacing: 4px !important; }
    .ed-tagline {
      margin-top: 24px;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
    }
    .ed-tagline .ja-tag { font-size: 20px; line-height: 1.5; }
    .ed-tagline .ja-tag .greet { margin-top: 4px; }
    .ed-tagline .ja-side { text-align: left; font-size: 10px; }

    /* --- INFO STRIP (2x3 grid on mobile, last cell full-width) --- */
    .ed-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      padding: 0 16px 20px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .ed-strip-cell { min-width: 0; }
    .ed-strip-cell {
      padding: 14px 14px 16px;
      border-right: 1px solid var(--line2);
      border-bottom: 1px solid var(--line2);
      min-height: 88px;
      gap: 6px;
    }
    .ed-strip-cell:nth-child(2n) { border-right: none; }
    .ed-strip-cell:nth-child(5) {
      grid-column: span 2;
      border-right: none;
      border-bottom: none;
    }
    .ed-strip-cell:nth-child(4) { border-bottom: none; }
    .ed-strip-cell .label { font-size: 9px; letter-spacing: 0.16em; }
    .ed-strip-cell .val { font-size: 28px; }
    .ed-strip-cell .val.small { font-size: 22px; }
    .ed-strip-cell .sub { font-size: 9px; }

    /* --- MAIN PANELS --- */
    main { padding: 16px; gap: 14px; }
    .panel { padding: 16px; }
    .panel h2 { font-size: 9px; letter-spacing: 0.25em; }

    /* --- DETAIL TABS (horizontal scroll) --- */
    .tabs {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      margin: 0 -16px 16px;
      padding: 0 16px;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 10px 14px; font-size: 10px; white-space: nowrap; flex-shrink: 0; }

    /* --- VIEWER CHIPS (relationship map) --- */
    .viewer-bar { gap: 6px; grid-template-columns: auto 1fr auto; }
    .viewer-bar .vlabel { font-size: 8px; letter-spacing: 0.15em; }
    .viewer-nav button { width: 32px; height: 32px; font-size: 16px; }
    .vc-chip { padding: 7px 11px 7px 10px; font-size: 12px; }
    .vc-chip .vc-score { font-size: 9px; padding: 2px 5px; }

    /* --- PERSON CARDS (bigger tap targets) --- */
    .cards { max-height: none; }
    .card { padding: 16px 14px; }
    .card:hover { transform: none; box-shadow: none; }
    .card-name { font-size: 16px; }
    .card-score { font-size: 24px; }
    .card-oneliner { font-size: 13px; padding: 10px 12px; }

    /* --- MODAL (full-width) --- */
    .modal { padding: 22px 18px; width: 96vw; max-height: 92vh; }
    .modal h2 { font-size: 18px; padding-bottom: 10px; }
    .form-grid { grid-template-columns: 1fr; gap: 12px; }
    .modal-section { margin-bottom: 18px; }
    .modal-actions { flex-direction: column-reverse; gap: 8px; }
    .modal-actions .left, .modal-actions .right { width: 100%; }
    .modal-actions .right .btn, .modal-actions .left .btn { width: 100%; }
    .blood-group label { padding: 12px; font-size: 14px; }
    .people-list { max-height: 280px; }

    /* --- PILLAR / GRID compactness --- */
    .pillar-cell { padding: 10px 4px; }
    .pillar-cell .pillar-stem, .pillar-cell .pillar-branch { font-size: 24px; margin-top: 4px; }
    .pillar-cell .pillar-meta { font-size: 8px; }
    .compat-matrix { font-size: 11px; }
    .cm-row .cm-name, .cm-row .cm-val { padding: 8px 10px; }
    .cm-row .cm-val { font-size: 13px; }

    /* --- TAROT row --- */
    .tarot-card { width: 96px; padding: 10px 8px; }
    .tarot-card .name { font-size: 12px; }

    /* --- WORDS feature --- */
    .words-hero { padding: 14px 0 18px; margin-bottom: 18px; }
    .words-hero .wh-title { font-size: 20px; line-height: 1.4; }
    .word-card { padding: 12px 14px; font-size: 14px; }
    .words-browse .wb-head { font-size: 13px; margin: 18px 0 8px; }
    .words-stats { font-size: 9px; gap: 10px; }

    /* --- INPUTS: prevent iOS zoom on focus --- */
    input, select, textarea { font-size: 16px !important; }
    .date-bar input[type=date], .ed-right input[type=date] { font-size: 14px !important; }
  }

  /* ≤480px = phone portrait extras */
  @media (max-width: 480px) {
    .ed-headline { font-size: clamp(38px, 14vw, 72px); }
    .ed-explore-stamp { display: none; }
    .ed-right .btn { font-size: 14px; }
    main { padding: 12px; }
    .panel { padding: 14px; }
    .ed-hero { padding: 16px 14px 12px; }
    .ed-strip { padding: 0 14px 16px; }
  }

  /* iOS safe area */
  @supports (padding: max(0px)) {
    body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    header.ed-nav { padding-top: max(10px, env(safe-area-inset-top)); }
  }
</style>
</head>

<header class="ed-nav">

        <circle cx="42" cy="14" r="9" fill="#cde2a3" stroke="var(--fg)" stroke-width="1.6"/>
        <circle cx="18.5" cy="15" r="3.6" fill="var(--fg)"/>
        <circle cx="42.5" cy="15" r="3.6" fill="var(--fg)"/>
        <circle cx="17" cy="14" r="0.9" fill="#fffaec"/>
        <circle cx="41" cy="14" r="0.9" fill="#fffaec"/>
        <path d="M22 35 Q30 41 38 35" stroke="var(--fg)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle cx="14" cy="34" r="1.4" fill="#e8a8a0" opacity="0.7"/>
        <circle cx="46" cy="34" r="1.4" fill="#e8a8a0" opacity="0.7"/>
      </svg>

<section class="ed-hero">

<section class="ed-strip" id="edStrip"></section>

// julianDay (Meeus)
function julianDay(date) {
  const d = new Date(date);
  let Y = d.getUTCFullYear(), M = d.getUTCMonth()+1;
  const D = d.getUTCDate() + (d.getUTCHours() + d.getUTCMinutes()/60)/24;
  if (M <= 2) { Y -= 1; M += 12; }
  const A = Math.floor(Y/100), B = 2 - A + Math.floor(A/4);
  return Math.floor(365.25*(Y+4716)) + Math.floor(30.6001*(M+1)) + D + B - 1524.5;
}

function rad(d) { return d * Math.PI / 180; }
function deg(r) { return r * 180 / Math.PI; }
function mod360(x) { return ((x % 360) + 360) % 360; }

// 太陽黄経 (Meeus)
function sunLongitude(date) {
  const JD = julianDay(date);
  const T = (JD - 2451545.0) / 36525;
  const L0 = mod360(280.46646 + 36000.76983*T + 0.0003032*T*T);
  const M  = mod360(357.52911 + 35999.05029*T - 0.0001537*T*T);
  const C = (1.914602 - 0.004817*T - 0.000014*T*T) * Math.sin(rad(M))
          + (0.019993 - 0.000101*T) * Math.sin(rad(2*M))
          + 0.000289 * Math.sin(rad(3*M));
  return mod360(L0 + C);
}

// 月黄経 (ELP2000 簡易)
function moonLongitude(date) {
  const JD = julianDay(date);
  const T = (JD - 2451545.0) / 36525;
  const Lp = mod360(218.3164477 + 481267.88123421*T - 0.0015786*T*T);
  const D  = mod360(297.8501921 + 445267.1114034*T - 0.0018819*T*T);
  const M  = mod360(357.5291092 + 35999.0502909*T - 0.0001536*T*T);
  const Mp = mod360(134.9633964 + 477198.8675055*T + 0.0087414*T*T);
  const F  = mod360(93.2720950  + 483202.0175233*T - 0.0036539*T*T);
  let sum = 0;
  sum += 6.288774 * Math.sin(rad(Mp));
  sum += 1.274027 * Math.sin(rad(2*D - Mp));
  sum += 0.658314 * Math.sin(rad(2*D));
  sum += 0.213618 * Math.sin(rad(2*Mp));
  sum -= 0.185116 * Math.sin(rad(M));
  sum -= 0.114332 * Math.sin(rad(2*F));
  sum += 0.058793 * Math.sin(rad(2*D - 2*Mp));
  sum += 0.057066 * Math.sin(rad(2*D - M - Mp));
  sum += 0.053322 * Math.sin(rad(2*D + Mp));
  sum += 0.045758 * Math.sin(rad(2*D - M));
  sum -= 0.040923 * Math.sin(rad(M - Mp));
  sum -= 0.034720 * Math.sin(rad(D));
  return mod360(Lp + sum);
}

function moonPhase(date) {
  const diff = mod360(moonLongitude(date) - sunLongitude(date));
  const phase = diff / 360;
  const age = phase * 29.530589;
  let label = '十六夜（欠けゆく月）', emoji = '🌖';
  for (const [a,b,n,e] of MOON_PHASES) {
    if (a > b) { if (phase >= a || phase < b) { label=n; emoji=e; break; } }
    else { if (phase >= a && phase < b) { label=n; emoji=e; break; } }
  }
  return { phase, age, label, emoji, diff };
}

function findSolarTermDate(year, lon) {
  const target = mod360(lon);
  let lo = new Date(Date.UTC(year - 1, 11, 15));
  let hi = new Date(Date.UTC(year + 1, 0, 31));
  for (let i = 0; i < 40; i++) {
    const mid = new Date((lo.getTime() + hi.getTime()) / 2);
    const ml = sunLongitude(mid);
    const diff = mod360(ml - target);
    if (diff > 180) lo = mid; else hi = mid;
  }
  return new Date((lo.getTime() + hi.getTime()) / 2);
}

function drawCardsSeeded(n, seed, positions) {
  const deck = buildDeck();
  const rnd = lcgSeed(seed >>> 0);
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  const picks = deck.slice(0, n);
  return picks.map((c, i) => ({ ...c, reversedDraw: rnd() < 0.5, position: positions ? positions[i] : '' }));
}

// ============================================================
// pickByDate
// ============================================================
function pickByDate(arr, date, salt) {
  const dt = (date instanceof Date) ? date : parseDate(date);
  const k = dt.getUTCFullYear()*10000 + (dt.getUTCMonth()+1)*100 + dt.getUTCDate();
  const seed = (k ^ Math.imul(salt, 2654435761)) >>> 0;
  return arr[seed % arr.length];
}

// ============================================================
// 12時辰盤
// ============================================================
function todayHourlyChart(date, dayP) {
  // 各時辰の通変星: 当日の時干と日干の通変
  const out = [];
  for (let bIdx = 0; bIdx < 12; bIdx++) {
    const zeroStem = WUSHUTEN[dayP.stem];
    const stemIdx = (STEMS.indexOf(zeroStem) + bIdx) % 10;
    const tb = tongbianStar(dayP.stemIdx, stemIdx);
    out.push({ branch: BRANCHES[bIdx], stem: STEMS[stemIdx], tongbian: tb, info: TONGBIAN_INFO[tb] || { rank:'-', desc:'' } });
  }
  return out;
}

function computeCompat(viewer, other, dateStr) {
  if (!viewer || !other || viewer.id === other.id) return 99;
  const seed = viewer.id + '|' + other.id + '|' + dateStr;
  const vHon = honmeiStar(viewer.birth);
  const oHon = honmeiStar(other.birth);
  const rel = starRelation(oHon, vHon);
  const vDay = dayPillar(viewer.birth);
  const oDay = dayPillar(other.birth);
  // viewer目線の通変 (viewerの日干 vs otherの日干)
  const tbFromViewer = tongbianStar(vDay.stemIdx, oDay.stemIdx);
  const tbBonus = ({'正官':20,'正財':18,'印綬':16,'食神':12,'偏財':10,'比肩':6,'偏官':4,'偏印':2,'傷官':-10,'劫財':-8})[tbFromViewer] || 0;
  const blood = (BLOOD_COMPAT[viewer.blood]?.[other.blood]) || 6;
  const v = Math.round(35 + rel.score * 4 + tbBonus + blood * 2 + ((hash(seed)%2000)/2000 - 0.5) * 15);
  return Math.max(10, Math.min(99, v));
}
function compatDetails(viewer, other, dateStr) {
  if (!viewer || !other || viewer.id === other.id) return null;
  const vHon = honmeiStar(viewer.birth);
  const oHon = honmeiStar(other.birth);
  const rel = starRelation(oHon, vHon);
  const tb = tongbianStar(dayPillar(viewer.birth).stemIdx, dayPillar(other.birth).stemIdx);
  const blood = (BLOOD_COMPAT[viewer.blood]?.[other.blood]) || 6;
  return { rel, tongbian: tb, tbInfo: TONGBIAN_INFO[tb] || {}, bloodScore: blood, score: computeCompat(viewer, other, dateStr) };
}

function runEngines(person, dateStr, viewerPerson) {
  const date = parseDate(dateStr);
  const yearP = yearPillar(person.birth);
  const monthP = monthPillar(person.birth);
  const dayP = dayPillar(person.birth);
  const hourP = (person.hour != null && person.hour !== '') ? hourPillar(dayP.stem, +person.hour) : null;

  const honmei = honmeiStar(person.birth);
  const getsumei = getsumeiStar(honmei, monthP.branchIdx);
  const dStar = dayStar(date);
  const relation = starRelation(honmei, dStar);

  const lifePath = lifePathNumber(person.birth);
  const bday = birthdayNumber(person.birth);
  const py = personalYear(person.birth, date.getUTCFullYear());
  const pday = personalDay(py, date.getUTCMonth()+1, date.getUTCDate());

  const bcards = birthCards(person.birth);
  const kua = calcKua(person.birth, person.gender || 'male');
  const dirs = dirRatings(kua.kua);

  const [m, d] = [date.getUTCMonth()+1, date.getUTCDate()];
  const sunSign = getSunSign(+person.birth.slice(5,7), +person.birth.slice(8,10));
  const sunLon = sunLongitude(date);
  const moon = moonPhase(date);

  // 今日の節気
  const yearTerms = solarTermsOfYear(date.getUTCFullYear());
  const prevYearTerms = solarTermsOfYear(date.getUTCFullYear()-1);
  const allTerms = [...prevYearTerms, ...yearTerms];
  let curTerm = allTerms[0];
  for (const t of allTerms) { if (t.date <= date) curTerm = t; else break; }
  const nextTerm = allTerms.find(t => t.date > date) || allTerms[allTerms.length-1];

  const todayDayP = dayPillar(dateStr);
  const dayStage = twelveStage(dayP.stem, todayDayP.branch);

  // 今日の干支×本人の通変 (運勢)
  const todayTongbian = tongbianStar(dayP.stemIdx, todayDayP.stemIdx);
  const todayInfo = TONGBIAN_INFO[todayTongbian] || { rank:'中吉', desc:'-' };

  // 大運 (現在何運か)
  const ageNow = date.getUTCFullYear() - parseDate(person.birth).getUTCFullYear();
  const daiun = calcDaiun(person.birth, person.gender || 'male', monthP, yearP);
  daiun.forEach(d => {
    const [a, b] = d.age.split('-').map(Number);
    d.current = ageNow >= a && ageNow <= b;
    d.tongbian = tongbianStar(dayP.stemIdx, STEMS.indexOf(d.stem));
  });

  // 12時辰
  const hourly = todayHourlyChart(date, todayDayP);

  // 易経 (today personal)
  const hex = todayPersonalHexagram(person.birth, date);

  // タロット 3 枚 (過去-現在-未来)
  const tarotSeed = hash(person.id + '|' + dateStr);
  const tarot = drawCardsSeeded(3, tarotSeed, ['過去','現在','未来']);

  // pickByDate
  const pdVariant = pickByDate(PERSONAL_DAY_VARIANTS, date, 101);
  const dColor    = pickByDate(DAY_COLORS,    date, 201);
  const dCaution  = pickByDate(DAY_CAUTIONS,  date, 301);
  const dFood     = pickByDate(DAY_FOODS,     date, 401);
  const dItem     = pickByDate(DAY_ITEMS,     date, 501);
  const dShadow   = pickByDate(SHADOW_BLESSINGS, date, 601);

  // MBTI: 人物固定 or 推定
  const mbti = person.mbti || (person.id === 'yoshida' ? 'INFJ' : inferMBTI(person));

  // スコア算出 (各種要素の総和)
  const bMod = (BLOOD[person.blood] || BLOOD['O']).mod;
  const seed = person.id + '|' + dateStr;
  const baseRng = ((hash(seed) % 10000) / 10000) * 40;
  const compatBonus = relation.score * 6;            // 6-30
  const tongbianBonus = ({'大吉':18,'吉':12,'中吉':6,'注意':-6,'-':0})[todayInfo.rank] || 0;
  const moonBonus = (Math.sin(moon.phase * Math.PI * 2)) * 6;
  const total = Math.max(15, Math.min(99, Math.round(40 + baseRng + compatBonus + tongbianBonus + moonBonus)));

  const work    = Math.max(10, Math.min(99, Math.round(total + ((hash(seed+'w')%2000)/2000 - 0.5)*30 + bMod.work)));
  const social  = Math.max(10, Math.min(99, Math.round(total + ((hash(seed+'s')%2000)/2000 - 0.5)*30 + bMod.social)));
  const health  = Math.max(10, Math.min(99, Math.round(total + ((hash(seed+'h')%2000)/2000 - 0.5)*30 + bMod.health)));
  const money   = Math.max(10, Math.min(99, Math.round(total + ((hash(seed+'m')%2000)/2000 - 0.5)*30 + bMod.money)));

  // 視点 (viewer) との相性。viewer は引数で渡せるが、未指定なら中心人物
  const viewer = (typeof viewerPerson !== 'undefined' && viewerPerson) ? viewerPerson : (PEOPLE.find(p => p.center) || PEOPLE[0]);
  const compatScore = computeCompat(viewer, person, dateStr);

  return {
    person, date, dateStr,
    total, work, social, health, money, compatScore,
    engines: {
      yearP, monthP, dayP, hourP,
      honmei, getsumei, dStar, relation,
      lifePath, bday, py, pday,
      bcards, kua, dirs,
      sunSign, sunLon, moon, curTerm, nextTerm,
      dayStage, todayTongbian, todayInfo,
      daiun, hourly, hex, tarot,
    },
    mbti,
    todayVariant: pdVariant, todayColor: dColor, todayCaution: dCaution,
    todayFood: dFood, todayItem: dItem, shadowBlessing: dShadow,
    advice: chooseAdvice(total, todayInfo.rank),
  };
}

function inferMBTI(person) {
  const types = Object.keys(MBTI_PROFILES);
  return types[hash(person.id) % types.length];
}
function chooseAdvice(total, rank) {
  if (total >= 80 || rank === '大吉') return '今日は大胆に行動してよい。新規提案や重要な打診のチャンス。';
  if (total >= 65) return '集中力が高い日。難しいタスクから着手しよう。';
  if (total >= 50) return '無理せず淡々と。報連相を丁寧に。';
  if (total >= 35) return '一歩引いて全体を俯瞰すると見えてくる。';
  return '重要な意思決定は明日に回そう。体調管理を最優先に。';
}

// 相性スコアの可視化 (●●●●○ + ラベル + 小さく数値)
// 各レベル3バリエーション; ペア+月でシード抽選して固定 (画面リロードで暴れない)
// 50以下は辛辣 (50/51 で言葉のトーンが切り替わる)
const COMPAT_LABELS = {
  5: ['深い縁', '響き合う縁', '魂が通う相手'],
  4: ['良い流れ', '澄んだ繋がり', '心地よい風'],
  3: ['穏やかな縁', 'やわらかな縁', '静かな繋がり'],
  2: ['浅い接点', '上滑りの縁', '深まりにくい'],         // 51-57 控えめ
  1: ['噛み合わない縁', '足を引っ張る相手', '消耗する関係'], // ≤50 辛辣
};
function compatLabel(score, seedKey) {
  // ●の数 (視覚)
  let level;
  if (score >= 88)      level = 5;
  else if (score >= 74) level = 4;
  else if (score >= 58) level = 3;
  else if (score >= 42) level = 2;
  else                  level = 1;
  // 言葉のトーン (50以下が辛辣) — ●の数とは独立
  let tier;
  if (score >= 88)      tier = 5;
  else if (score >= 74) tier = 4;
  else if (score >= 58) tier = 3;
  else if (score >= 51) tier = 2;
  else                  tier = 1; // ≤50 → 辛辣
  const variants = COMPAT_LABELS[tier];
  const idx = seedKey ? (hash(String(seedKey)) % variants.length) : 0;
  return { level, label: variants[idx] };
}
function compatVis(score, opts) {
  opts = opts || {};
  const { level, label } = compatLabel(score, opts.seed);
  const size = opts.size || ''; // 'tight' | 'big' | ''
  const showNum = !opts.hideNum;
  const dots = Array.from({length:5}, (_,i) =>
    `<span class="cdot${i < level ? ' on' : ''}"></span>`).join('');
  return `<span class="compat-vis ${size}">${dots}<span class="clbl">${label}</span>${showNum?`<span class="cnum">${score}</span>`:''}</span>`;
}

function scoreColor(s) {
  if (s >= 80) return '#3d5e44';   // 大吉 — 苔
  if (s >= 65) return '#5e7a4f';   // 中の上 — 若苔
  if (s >= 50) return '#8a7240';   // 中 — 黄土
  if (s >= 35) return '#8c5a3a';   // 中の下 — 焦茶
  return '#8c3a3a';                 // 凶 — 朱
}

function daysSince(birthStr, dateStr) {
  return Math.floor((parseDate(dateStr) - parseDate(birthStr)) / 86400000);
}
function firstNameJa(person) {
  // 「吉田 駿成」→「駿成」/「しゅんすけ」を優先 (roleに含まれていれば)
  const role = person.role || '';
  const m = role.match(/しゅんすけ|[ぁ-ゖァ-ヺ一-龯々]{2,}(?=さん|くん)?/);
  if (m && m[0] !== '本人' && m[0] !== '上司' && m[0] !== '同僚' && m[0] !== '部下' && m[0] !== '後輩' && m[0] !== '取引先') return m[0];
  const parts = (person.name || '').split(/\s+/);
  return parts[parts.length - 1] || person.name || '';
}
function greetingFor(dateStr, person) {
  const h = new Date().getUTCHours() + 9; // JST approx
  const head = (h < 11) ? 'おはようございます' : (h < 18) ? 'こんにちは' : 'こんばんは';
  return `${head}、${firstNameJa(person)}さん。`;
}

function drawViewerChips(all) {
  const $vc = document.getElementById('viewerChips');
  if (!$vc) return;
  $vc.innerHTML = PEOPLE.map(p => {
    const score = all && all[p.id] ? all[p.id].total : '';
    const scoreHtml = score !== '' ? `<span class="vc-score" style="color:${scoreColor(score)}">${score}</span>` : '';
    return `<button class="vc-chip${viewerId === p.id ? ' active' : ''}" data-id="${p.id}">`
         + `<span>${p.name}</span>`
         + (p.center ? '<span class="vc-mini">center</span>' : '')
         + scoreHtml
         + `</button>`;
  }).join('');
  $vc.querySelectorAll('.vc-chip').forEach(b => {
    b.addEventListener('click', () => {
      viewerId = b.dataset.id;
      selectedId = viewerId;
      render();
    });
  });
  // アクティブチップを視野内にスクロール
  const active = $vc.querySelector('.vc-chip.active');
  if (active) {
    const cw = $vc.clientWidth;
    const ow = active.offsetWidth;
    const ol = active.offsetLeft;
    const left = Math.max(0, ol - (cw - ow) / 2);
    try {
      if (typeof $vc.scrollTo === 'function') $vc.scrollTo({ left, behavior: 'smooth' });
      else $vc.scrollLeft = left;
    } catch { $vc.scrollLeft = left; }
  }
  // 前後ボタン
  const idx = PEOPLE.findIndex(p => p.id === viewerId);
  const $prev = document.getElementById('viewerPrev');
  const $next = document.getElementById('viewerNext');
  if ($prev) {
    $prev.disabled = idx <= 0;
    $prev.onclick = () => { if (idx > 0) { viewerId = PEOPLE[idx-1].id; selectedId = viewerId; render(); } };
  }
  if ($next) {
    $next.disabled = idx >= PEOPLE.length - 1;
    $next.onclick = () => { if (idx < PEOPLE.length - 1) { viewerId = PEOPLE[idx+1].id; selectedId = viewerId; render(); } };
  }
}

function drawRadial(date, all) {
  const NS = 'http://www.w3.org/2000/svg';
  const CX=300, CY=300, R=200;
  $svg.innerHTML = '';
  const center = PEOPLE.find(p => p.center) || PEOPLE[0];
  const viewer = getViewer();
  const others = PEOPLE.filter(p => p.id !== center.id);

  // 各人の位置を確定 (中心はCX,CY / その他は円周)
  const positions = { [center.id]: { x: CX, y: CY, radius: 50, isCenter: true } };
  others.forEach((p, i) => {
    const angle = (-Math.PI/2) + (i / others.length) * Math.PI * 2;
    positions[p.id] = { x: CX + Math.cos(angle)*R, y: CY + Math.sin(angle)*R, radius: 36, isCenter: false };
  });

  // 七宝-inspired decorative rings (mono, slow rotation)
  const ringGroupCW = document.createElementNS(NS, 'g');
  ringGroupCW.setAttribute('class', 'ring-rotate-cw');
  const ringGroupCCW = document.createElementNS(NS, 'g');
  ringGroupCCW.setAttribute('class', 'ring-rotate-ccw');
  for (let i = 0; i < 4; i++) {
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('cx', CX); ring.setAttribute('cy', CY);
    ring.setAttribute('r', 60 + i*50);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', '#cfcdc6');
    ring.setAttribute('stroke-width', i === 1 ? 0.8 : 0.4);
    if (i !== 0) ring.setAttribute('stroke-dasharray', i % 2 === 0 ? '2 4' : '6 10');
    (i % 2 === 0 ? ringGroupCW : ringGroupCCW).appendChild(ring);
  }
  $svg.appendChild(ringGroupCW);
  $svg.appendChild(ringGroupCCW);
  // cross lines
  const cross = document.createElementNS(NS, 'g');
  cross.innerHTML = `
    <line x1="${CX-220}" y1="${CY}" x2="${CX+220}" y2="${CY}" stroke="#e4e1d9" stroke-width="0.4"/>
    <line x1="${CX}" y1="${CY-220}" x2="${CX}" y2="${CY+220}" stroke="#e4e1d9" stroke-width="0.4"/>
  `;
  $svg.appendChild(cross);

  // 視点ノードから他全員へラインを引く
  const vPos = positions[viewer.id];
  PEOPLE.forEach(p => {
    if (p.id === viewer.id) return;
    const oPos = positions[p.id];
    const c = all[p.id].compatScore;
    const link = document.createElementNS(NS, 'line');
    link.setAttribute('x1', vPos.x); link.setAttribute('y1', vPos.y);
    link.setAttribute('x2', oPos.x); link.setAttribute('y2', oPos.y);
    link.setAttribute('class', 'link flowing');
    link.setAttribute('stroke', scoreColor(c));
    link.setAttribute('stroke-width', 1 + (c/100)*3);
    link.setAttribute('opacity', 0.3 + (c/100)*0.5);
    link.style.animationDuration = (4 - (c/100)*2.5).toFixed(2) + 's';
    $svg.appendChild(link);
    const mx = (vPos.x + oPos.x)/2, my = (vPos.y + oPos.y)/2;
    const cl = compatLabel(c, viewer.id + '|' + p.id + '|' + date.slice(0,7));
    const lbl = document.createElementNS(NS, 'text');
    lbl.setAttribute('x', mx); lbl.setAttribute('y', my - 3);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('font-size', '11');
    lbl.setAttribute('fill', scoreColor(c));
    lbl.setAttribute('font-weight', '600');
    lbl.style.fontFamily = "var(--serif)";
    lbl.textContent = cl.label;
    $svg.appendChild(lbl);
  });

  // ノード描画
  PEOPLE.forEach(p => {
    const pos = positions[p.id];
    drawNode(pos.x, pos.y, p, all[p.id], pos.radius, pos.isCenter);
  });

  // 視点バッジ (viewerノードの上に "VIEWPOINT" ラベル)
  const vBadge = document.createElementNS(NS, 'g');
  vBadge.innerHTML = `
    <rect x="${vPos.x - 42}" y="${vPos.y - vPos.radius - 28}" width="84" height="16" fill="#15151a"/>
    <text x="${vPos.x}" y="${vPos.y - vPos.radius - 17}" text-anchor="middle" font-size="9" fill="#ebe9e4" style="letter-spacing:0.25em;font-family:var(--sans)">VIEWPOINT</text>
  `;
  $svg.appendChild(vBadge);
}
function drawNode(cx, cy, person, r, radius, isCenter) {
  const NS = 'http://www.w3.org/2000/svg';
  const f = r;
  const isSel = selectedId === person.id;

  // outer score ring
  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy);
  ring.setAttribute('r', radius + 6);
  ring.setAttribute('fill', 'none');
  ring.setAttribute('stroke', scoreColor(f.total));
  ring.setAttribute('stroke-width', 3);
  ring.setAttribute('opacity', 0.7);
  $svg.appendChild(ring);

  // pulse ring for selected
  if (isSel) {
    const pulse = document.createElementNS(NS, 'circle');
    pulse.setAttribute('cx', cx); pulse.setAttribute('cy', cy);
    pulse.setAttribute('r', radius + 10);
    pulse.setAttribute('fill', 'none');
    pulse.setAttribute('stroke', '#15151a');
    pulse.setAttribute('stroke-width', 1.5);
    pulse.setAttribute('class', 'pulse-ring');
    $svg.appendChild(pulse);
    // second wave
    const pulse2 = document.createElementNS(NS, 'circle');
    pulse2.setAttribute('cx', cx); pulse2.setAttribute('cy', cy);
    pulse2.setAttribute('r', radius + 10);
    pulse2.setAttribute('fill', 'none');
    pulse2.setAttribute('stroke', '#15151a');
    pulse2.setAttribute('stroke-width', 1.5);
    pulse2.setAttribute('class', 'pulse-ring');
    pulse2.style.animationDelay = '1.2s';
    $svg.appendChild(pulse2);
  }

  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', cx); c.setAttribute('cy', cy);
  c.setAttribute('r', radius);
  c.setAttribute('fill', KYUSEI[f.engines.honmei].color);
  c.setAttribute('fill-opacity', 0.25);
  c.setAttribute('stroke', KYUSEI[f.engines.honmei].color);
  c.setAttribute('stroke-width', 2);
  c.setAttribute('class', 'node-circle' + (isSel ? ' selected' : ''));
  c.addEventListener('click', () => { selectedId = person.id; render(); });
  $svg.appendChild(c);

  const score = document.createElementNS(NS, 'text');
  score.setAttribute('x', cx); score.setAttribute('y', cy + 5);
  score.setAttribute('class', 'node-score');
  score.style.fontSize = (isCenter ? 22 : 16) + 'px';
  score.textContent = f.total;
  $svg.appendChild(score);

  const name = document.createElementNS(NS, 'text');
  name.setAttribute('x', cx); name.setAttribute('y', cy + radius + 22);
  name.setAttribute('class', 'node-label');
  name.textContent = person.name + (isCenter ? '（中心）' : '');
  $svg.appendChild(name);

  const sub = document.createElementNS(NS, 'text');
  sub.setAttribute('x', cx); sub.setAttribute('y', cy + radius + 36);
  sub.setAttribute('class', 'node-sub');
  sub.textContent = KYUSEI[f.engines.honmei].name + ' / ' + f.engines.dayP.ganzhi;
  $svg.appendChild(sub);
}

function gaugeSvg(value, color) {
  const R = 70, C = 2 * Math.PI * R;
  const offset = C - (value / 100) * C;
  const W = 180;
  return `<div class="gauge-wrap" style="width:${W}px;height:${W}px">
    <svg class="gauge-svg" viewBox="0 0 ${W} ${W}" style="width:${W}px;height:${W}px">
      <circle cx="${W/2}" cy="${W/2}" r="${R}" fill="none" stroke="#e4e1d9" stroke-width="6"/>
      <circle class="gauge-fg" cx="${W/2}" cy="${W/2}" r="${R}" fill="none"
        stroke="${color}" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${offset}"
        style="--gauge-len:${C}"/>
      <!-- tick marks -->
      ${Array.from({length:20}, (_,i) => {
        const a = (i / 20) * Math.PI * 2 - Math.PI/2;
        const x1 = W/2 + Math.cos(a) * (R - 12);
        const y1 = W/2 + Math.sin(a) * (R - 12);
        const x2 = W/2 + Math.cos(a) * (R - 16);
        const y2 = W/2 + Math.sin(a) * (R - 16);
        return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#cfcdc6" stroke-width="0.5"/>`;
      }).join('')}
    </svg>
    <div class="gauge-num" style="color:${color}">${value}</div>
    <div class="gauge-cap">Today</div>
  </div>`;
}

function moonSvg(phase) {
  const W = 180, H = 180, R = 78;
  const k = Math.cos(phase * Math.PI * 2);
  const shadow = '#1a1a1f', light = '#f4f2ec', edge = '#15151a';
  return `<svg class="moon-svg" viewBox="0 0 ${W} ${H}" style="width:180px;height:180px">
    <circle cx="${W/2}" cy="${H/2}" r="${R}" fill="${light}"/>
    <ellipse cx="${W/2 + k*R}" cy="${H/2}" rx="${Math.abs(k)*R}" ry="${R}" fill="${shadow}"/>
    ${phase < 0.5 ? `<rect x="${W/2}" y="${H/2-R}" width="${R}" height="${R*2}" fill="${shadow}"/>` : `<rect x="${W/2-R}" y="${H/2-R}" width="${R}" height="${R*2}" fill="${shadow}"/>`}
    <circle cx="${W/2}" cy="${H/2}" r="${R}" fill="none" stroke="${edge}" stroke-width="1"/>
  </svg>`;
}
