function compassSvg(dirs) {
  const W=320, H=320, CX=W/2, CY=H/2, R=130, IR=60;
  const order = ['北','東北','東','東南','南','西南','西','西北'];
  const segments = order.map((dir, i) => {
    const a0 = (-Math.PI/2) + (i - 0.5)/8 * Math.PI*2;
    const a1 = (-Math.PI/2) + (i + 0.5)/8 * Math.PI*2;
    const x0o = CX + Math.cos(a0)*R, y0o = CY + Math.sin(a0)*R;
    const x1o = CX + Math.cos(a1)*R, y1o = CY + Math.sin(a1)*R;
    const x0i = CX + Math.cos(a0)*IR, y0i = CY + Math.sin(a0)*IR;
    const x1i = CX + Math.cos(a1)*IR, y1i = CY + Math.sin(a1)*IR;
    const rate = dirs[dir] || '-';
    const c = (DIR_RANK[rate] || ['','#666',''])[1];
    const am = (a0+a1)/2;
    const lx = CX + Math.cos(am)*(R+IR)/2, ly = CY + Math.sin(am)*(R+IR)/2;
    const labelX = CX + Math.cos(am)*(R+18), labelY = CY + Math.sin(am)*(R+18) + 4;
    return `<path d="M${x0i},${y0i} L${x0o},${y0o} A${R},${R} 0 0,1 ${x1o},${y1o} L${x1i},${y1i} A${IR},${IR} 0 0,0 ${x0i},${y0i} Z" fill="${c}" fill-opacity="0.35" stroke="#15151a" stroke-width="0.7"/>
      <text x="${lx}" y="${ly+3}" text-anchor="middle" font-size="10" fill="#15151a" font-weight="500" style="font-family:'Hiragino Mincho ProN',serif">${rate}</text>
      <text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="13" fill="#15151a" font-weight="500" style="font-family:'Hiragino Mincho ProN',serif">${dir}</text>`;
  }).join('');
  // 生気方位を指す針 (回転角度)
  const dirAngles = { '北':-90, '東北':-45, '東':0, '東南':45, '南':90, '西南':135, '西':180, '西北':225 };
  const seikiDir = Object.entries(dirs).find(([k,v]) => v === '生気')?.[0];
  const needleDeg = (dirAngles[seikiDir] ?? -90) + 90; // SVG defaults pointing up
  return `<svg class="compass-svg" viewBox="0 0 ${W} ${H}" style="width:300px;height:300px">${segments}
    <circle cx="${CX}" cy="${CY}" r="${IR-2}" fill="#ffffff" stroke="#15151a" stroke-width="1"/>
    <g class="compass-needle" style="transform:rotate(${needleDeg}deg);transform-origin:${CX}px ${CY}px">
      <polygon points="${CX},${CY-IR+8} ${CX-5},${CY+5} ${CX+5},${CY+5}" fill="#15151a"/>
      <polygon points="${CX},${CY+IR-12} ${CX-3},${CY-3} ${CX+3},${CY-3}" fill="#a3a3a3"/>
    </g>
    <circle cx="${CX}" cy="${CY}" r="3" fill="#15151a"/>
    <text x="${CX}" y="${CY+IR+18}" text-anchor="middle" font-size="9" fill="#7a7a78" style="letter-spacing:0.25em">SEIKI ${seikiDir||''}</text>
  </svg>`;
}

// SYNC (PC ⇄ Smartphone) — URL hash + JSON paste
// ============================================================
function encodeSync(people) {
  const json = JSON.stringify(people);
  // unicode-safe base64url
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return b64.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeSync(s) {
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  const json = decodeURIComponent(escape(atob(s)));
  const arr = JSON.parse(json);
  if (!Array.isArray(arr) || !arr.length) throw new Error('invalid');
  return arr;
}
function makeSyncURL() {
  const base = location.origin + location.pathname;
  return base + '#sync=' + encodeSync(PEOPLE);
}
function applySyncString(s) {
  s = String(s||'').trim();
  if (!s) throw new Error('empty');
  // 受付フォーマット: URL全体 / hashのみ / sync=... / 生base64 / 生JSON
  const mURL = s.match(/[#?&]sync=([^&\s#]+)/);
  if (mURL) s = mURL[1];
  else if (s.startsWith('sync=')) s = s.slice(5);
  let arr;
  if (s.trim().startsWith('[')) {
    arr = JSON.parse(s);
    if (!Array.isArray(arr) || !arr.length) throw new Error('invalid');
  } else {
    arr = decodeSync(s);
  }
  PEOPLE = arr;
  if (!PEOPLE.some(p => p.center) && PEOPLE.length) PEOPLE[0].center = true;
  savePeople();
  return arr.length;
}
// ページ読み込み時、URL の #sync=... を検出して自動取り込み
(function autoSync() {
  try {
    const m = location.hash.match(/sync=([^&]+)/);
    if (!m) return;
    const n = applySyncString(m[1]);
    // hash を消す (重複取込み防止)
    history.replaceState(null, '', location.pathname + location.search);
    setTimeout(() => alert(`✓ ${n}件のデータを取り込みました (PC→このデバイス同期完了)`), 100);
  } catch (e) {
    console.warn('auto-sync failed', e);
  }
})();

  };
  document.getElementById('syncOpenURL').onclick = () => window.open(url, '_blank');
  document.getElementById('syncCopyJSON').onclick = async () => {
    document.getElementById('syncJSON').select();
    flash(await copyToClipboard(document.getElementById('syncJSON').value) ? '✓ JSONをコピーしました' : '⚠ コピー失敗', false);
  };
  document.getElementById('syncImportJSON').onclick = () => {
    const v = document.getElementById('syncJSON').value;
    try {
      const n = applySyncString(v);
      flash(`✓ ${n}件を取り込みました。再描画します…`);
      setTimeout(() => { sm.remove(); render(); }, 600);
    } catch (e) {
      flash('⚠ 形式が正しくありません: ' + e.message, false);
    }
  };
  document.getElementById('syncDownloadJSON').onclick = () => {
    const blob = new Blob([document.getElementById('syncJSON').value], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `yoshida_fortune_people_${todayStr()}.json`;
    a.click();
    flash('✓ ダウンロードしました');
  };
  document.getElementById('syncCloseBtn').onclick = () => sm.remove();
  sm.addEventListener('click', e => { if (e.target === sm) sm.remove(); });
}

function resetForm() {
  $fId.value = ''; $fName.value = ''; $fRole.value = ''; $fBirth.value = '';
  $fHour.value = ''; $fGender.value = 'male'; $fCenter.checked = false;
  document.querySelectorAll('input[name=blood]').forEach(r => r.checked = false);
  $modalTitle.textContent = '人物の登録';
  $submitBtn.textContent = '登録する';
  $deleteBtn.style.display = 'none';
}
$resetFormBtn.addEventListener('click', resetForm);
function loadForm(p) {
  $fId.value = p.id; $fName.value = p.name; $fRole.value = p.role || '';
  $fBirth.value = p.birth; $fHour.value = p.hour != null ? p.hour : '';
  $fGender.value = p.gender || 'male'; $fCenter.checked = !!p.center;
  document.querySelectorAll('input[name=blood]').forEach(r => r.checked = (r.value === p.blood));
  $modalTitle.textContent = `「${p.name}」を編集`;
  $submitBtn.textContent = '更新する';
  $deleteBtn.style.display = '';
}
$form.addEventListener('submit', e => {
  e.preventDefault();
  const name = $fName.value.trim(), birth = $fBirth.value;
  if (!name || !birth) return;
  const blood = (document.querySelector('input[name=blood]:checked') || {}).value || 'O';
  const id = $fId.value || ('p' + Date.now().toString(36));
  const isCenter = $fCenter.checked;
  const hourVal = $fHour.value === '' ? null : Math.max(0, Math.min(23, +$fHour.value));
  const data = { id, name, role: $fRole.value.trim(), birth, hour: hourVal, gender: $fGender.value, blood, center: isCenter };
  const idx = PEOPLE.findIndex(p => p.id === id);
  if (idx >= 0) PEOPLE[idx] = data; else PEOPLE.push(data);
  if (isCenter) PEOPLE.forEach(p => { if (p.id !== id) p.center = false; });
  if (!PEOPLE.some(p => p.center)) PEOPLE[0].center = true;
  savePeople(); resetForm(); renderPeopleList();
  selectedId = id; render();
});
$deleteBtn.addEventListener('click', () => {
  const id = $fId.value; if (!id) return;
  if (!confirm('この人物を削除しますか？')) return;
  PEOPLE = PEOPLE.filter(p => p.id !== id);
  if (!PEOPLE.some(p => p.center) && PEOPLE.length) PEOPLE[0].center = true;
  savePeople(); resetForm(); renderPeopleList();
  if (selectedId === id) selectedId = (PEOPLE[0]||{}).id || '';
  if (viewerId === id) viewerId = (PEOPLE.find(p => p.center) || PEOPLE[0] || {}).id || '';
  render();
});
$resetAllBtn.addEventListener('click', () => {
  if (!confirm('全データをサンプルに戻しますか？')) return;
  PEOPLE = DEFAULT_PEOPLE.slice();
  savePeople(); resetForm(); renderPeopleList();
  selectedId = 'yoshida'; render();
});
function renderPeopleList() {
  $peopleList.innerHTML = '';
  if (!PEOPLE.length) { $peopleList.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px">登録された人物はいません</div>'; return; }
  PEOPLE.forEach(p => {
    const row = document.createElement('div');
    row.className = 'person-row';
    row.innerHTML = `
      <div>
        <div>${p.name} ${p.center ? '<span class="center-badge">中心</span>' : ''}</div>
        <div class="meta">${p.role || '—'} ・ ${p.birth}${p.hour!=null?` ${p.hour}時`:''} ・ ${p.gender==='female'?'女':'男'} ・ ${p.blood || '?'}型</div>
      </div>
      <button class="ico-btn" data-act="edit" title="編集">✎</button>
      <button class="ico-btn" data-act="del"  title="削除">🗑</button>
    `;
    row.querySelector('[data-act=edit]').addEventListener('click', () => loadForm(p));
    row.querySelector('[data-act=del]').addEventListener('click', () => {
      if (!confirm(`「${p.name}」を削除しますか？`)) return;
      PEOPLE = PEOPLE.filter(x => x.id !== p.id);
      if (!PEOPLE.some(x => x.center) && PEOPLE.length) PEOPLE[0].center = true;
      savePeople(); renderPeopleList();
      if (selectedId === p.id) selectedId = (PEOPLE[0]||{}).id || '';
      render();
    });
    $peopleList.appendChild(row);
  });
}

// ============================================================
const TRAIT_POOLS = {
  // 本命星元素ごとの形容詞 — その人「らしさ」を語る語彙
  '水': ['静かな','深い','透明な','内省的な','遠くを見る','澄んだ'],
  '木': ['しなやかな','伸びる','若々しい','まっすぐな','育てる','瑞々しい'],
  '火': ['情熱的な','明るい','燃える','華やかな','閃く','率直な'],
  '土': ['誠実な','安定した','穏やかな','根を張る','受け止める','地に足の付いた'],
  '金': ['鋭い','磨かれた','凛とした','切れ味のある','洗練された','貫く'],
};
const KIND_POOLS = {
  'gentle': ['やわらかな','まっすぐな','落ち着いた','信頼の','深い','静かな'],
  'sharp':  ['率直な','本気の','研ぎ澄ました','迷いない','芯のある','責任ある'],
  'warm':   ['あたたかい','寛いだ','親しい','じんわりとした','包む','迎える'],
};
// 五行 → トーンマッピング (viewer→target の関係)
function toneFromRelation(rel) {
  // rel.name: '相生(発展)','比和(調和)','洩気(消耗)','相剋(摩擦)','受剋(被害)'
  if (rel.name.startsWith('相生')) return { tone:'育', kind:'warm',   note:'育てる声で' };
  if (rel.name.startsWith('比和')) return { tone:'共', kind:'gentle', note:'対等な声で' };
  if (rel.name.startsWith('洩気')) return { tone:'労', kind:'warm',   note:'労わる声で' };
  if (rel.name.startsWith('相剋')) return { tone:'断', kind:'sharp',  note:'端的に' };
  if (rel.name.startsWith('受剋')) return { tone:'敬', kind:'gentle', note:'敬意をもって' };
  return { tone:'平', kind:'gentle', note:'自然に' };
}

function getPersonCtx(person, f) {
  // 名前バリエーション (吉田はニックネーム含む、他は名字+さん)
  const nameParts = (person.name || '').split(/\s+/);
  const last = nameParts[0] || person.name || '';
  const first = nameParts[nameParts.length - 1] || last;
  let names;
  if (person.id === 'yoshida') {
    names = ['駿成','しゅんすけ','吉田くん','吉田','あなた','君'];
  } else {
    names = [last, last + 'さん', first, 'あなた'].filter((v, i, a) => v && a.indexOf(v) === i);
  }
  const el = KYUSEI[f.engines.honmei].el;
  const traits = TRAIT_POOLS[el] || TRAIT_POOLS['土'];
  return {
    names, traits,
    kinds: KIND_POOLS['gentle'],
    color: f.todayColor, item: f.todayItem,
    sunSign: f.engines.sunSign,
    honmeiName: KYUSEI[f.engines.honmei].name,
    tongbian: f.engines.todayTongbian,
  };
}

function fillSlots(template, seed, ctx) {
  const names  = ctx.names  || ['あなた'];
  const traits = ctx.traits || TRAIT_POOLS['土'];
  const kinds  = ctx.kinds  || KIND_POOLS['gentle'];
  return template
    .replace(/\{n\}/g,  names[seed % names.length])
    .replace(/\{t\}/g,  traits[(seed * 7) % traits.length])
    .replace(/\{k\}/g,  kinds[(seed * 3) % kinds.length])
    .replace(/\{c\}/g,  ctx.color || '黄')
    .replace(/\{i\}/g,  ctx.item  || 'コーヒー')
    .replace(/\{s\}/g,  ctx.honmeiName || '七赤金星')
    .replace(/\{z\}/g,  ctx.sunSign || '牡牛座')
    .replace(/\{tb\}/g, ctx.tongbian || '');
}

function instanceCountWords(arr, ctx) {
  ctx = ctx || { names: ['あなた'], traits: TRAIT_POOLS['土'], kinds: KIND_POOLS['gentle'] };
  let total = 0;
  for (const [_, t] of arr) {
    let v = 1;
    if (t.includes('{n}')) v *= ctx.names.length;
    if (t.includes('{t}')) v *= ctx.traits.length;
    if (t.includes('{k}')) v *= ctx.kinds.length;
    if (t.includes('{c}')) v *= DAY_COLORS.length;
    if (t.includes('{i}')) v *= DAY_ITEMS.length;
    total += v;
  }
  return total;
}

// 案B: 占術プロファイル → カテゴリ重み
function categoryWeights(person, f, viewer) {
  const W = {
    // WANT カテゴリ baseline = 1
    want: { '存在':1,'直感':1,'労い':1,'理解':1,'創造':1,'過程':1,'実力':1,'未来':1,'役割':1,'関係':1 },
    // AVOID カテゴリ baseline = 1
    avoid:{ '軽視':1,'普通':1,'結論':1,'協調':1,'存在否定':1,'努力否定':1,'容姿':1,'性役割':1,'個性否定':1,'協調否定':1,'過去':1,'比較':1 },
  };
  const el = KYUSEI[f.engines.honmei].el;
  const mbti = f.mbti || 'INFJ';
  const blood = person.blood || 'O';
  const tb = f.engines.todayTongbian;

  // ---- 本命星の五行 ----
  if (el === '水') { W.want['理解']*=2.0; W.want['労い']*=1.8; W.want['直感']*=1.6; W.avoid['結論']*=1.8; W.avoid['軽視']*=1.6; }
  if (el === '木') { W.want['未来']*=1.8; W.want['過程']*=1.6; W.want['創造']*=1.4; W.avoid['過去']*=1.8; W.avoid['普通']*=1.6; }
  if (el === '火') { W.want['創造']*=2.0; W.want['存在']*=1.6; W.want['実力']*=1.4; W.avoid['個性否定']*=1.8; W.avoid['容姿']*=1.6; }
  if (el === '土') { W.want['役割']*=1.8; W.want['関係']*=1.6; W.want['過程']*=1.4; W.avoid['協調否定']*=1.6; W.avoid['性役割']*=1.4; }
  if (el === '金') { W.want['実力']*=2.0; W.want['創造']*=1.6; W.want['直感']*=1.4; W.avoid['軽視']*=1.8; W.avoid['比較']*=1.6; }

  // ---- 通変 (今日) ----
  if (tb === '正官' || tb === '印綬') { W.want['役割']*=1.4; W.want['実力']*=1.3; }
  if (tb === '食神')                  { W.want['創造']*=1.6; W.want['過程']*=1.3; }
  if (tb === '比肩' || tb === '劫財') { W.want['存在']*=1.4; W.avoid['比較']*=1.5; }
  if (tb === '傷官')                  { W.want['理解']*=1.6; W.avoid['軽視']*=1.5; W.avoid['結論']*=1.4; }
  if (tb === '偏官')                  { W.want['実力']*=1.4; W.want['未来']*=1.3; }

  // ---- MBTI ----
  if (mbti.startsWith('IN')) { W.want['理解']*=1.5; W.want['直感']*=1.4; W.avoid['普通']*=1.4; }   // INTJ/INTP/INFJ/INFP
  if (mbti.startsWith('EN')) { W.want['未来']*=1.3; W.want['創造']*=1.2; }
  if (mbti.endsWith('FJ') || mbti.endsWith('FP')) { W.want['関係']*=1.3; W.avoid['個性否定']*=1.4; }
  if (mbti.endsWith('TJ') || mbti.endsWith('TP')) { W.want['実力']*=1.3; W.avoid['結論']*=0.7; }
  if (mbti.includes('SP')) { W.want['過程']*=1.3; W.want['存在']*=1.2; }

  // ---- 血液型 ----
  if (blood === 'A')  { W.want['理解']*=1.3; W.avoid['結論']*=1.3; }
  if (blood === 'B')  { W.want['存在']*=1.4; W.want['労い']*=1.3; W.avoid['協調否定']*=1.5; W.avoid['普通']*=1.4; }
  if (blood === 'O')  { W.want['実力']*=1.3; W.want['役割']*=1.2; }
  if (blood === 'AB') { W.want['直感']*=1.3; W.avoid['軽視']*=1.3; }

  // ---- 今日の総合運 ムード ----
  if (f.total >= 75) { // 攻め
    W.want['未来']*=2.5; W.want['実力']*=2.0; W.want['創造']*=1.5;
    W.want['労い']*=0.4; W.want['理解']*=0.7;
  } else if (f.total <= 45) { // 労い
    W.want['労い']*=3.0; W.want['存在']*=2.0; W.want['理解']*=1.8;
    W.want['実力']*=0.3; W.want['未来']*=0.4;
  } else { // やわらか
    W.want['過程']*=1.6; W.want['理解']*=1.5;
  }

  // ---- 案C: viewer→person の五行関係でトーン色付け ----
  if (viewer && viewer.id !== person.id) {
    const vHon = honmeiStar(viewer.birth);
    const rel = starRelation(vHon, f.engines.honmei);
    const tone = toneFromRelation(rel);
    if (tone.tone === '育') { W.want['未来']*=1.4; W.want['過程']*=1.3; }
    if (tone.tone === '共') { W.want['関係']*=1.4; W.want['理解']*=1.2; }
    if (tone.tone === '労') { W.want['労い']*=1.6; W.want['存在']*=1.2; }
    if (tone.tone === '断') { W.want['実力']*=1.4; W.want['未来']*=1.2; }
    if (tone.tone === '敬') { W.want['役割']*=1.3; W.want['理解']*=1.2; }
  }

  return W;
}

function pickWordsWeighted(arr, person, f, viewer, n, ctx, salt) {
  const weights = categoryWeights(person, f, viewer);
  const isWant = arr === WANT_WORDS;
  const wmap = isWant ? weights.want : weights.avoid;
  const seed = hash(person.id + '|' + f.dateStr + '|' + (salt || (isWant?'w':'a')));
  const rnd = lcgSeed(seed);

  const pool = arr.map(([cat, tmpl], i) => ({ i, cat, tmpl, w: wmap[cat] || 1 }));
  const picks = [];
  for (let k = 0; k < n && pool.length; k++) {
    const total = pool.reduce((s, x) => s + x.w, 0);
    if (total <= 0) break;
    let r = rnd() * total;
    let idx = 0;
    for (; idx < pool.length - 1; idx++) { r -= pool[idx].w; if (r <= 0) break; }
    const c = pool.splice(idx, 1)[0];
    picks.push({ cat: c.cat, text: fillSlots(c.tmpl, c.i + Math.floor(rnd()*100), ctx), weight: c.w });
  }
  return picks;
}

// 各人カードの「今日 viewer がかける言葉」(複数バリアント)
const _olRotate = {}; // person.id → number (↻ボタンで増分)
function bumpOneLinerRotate(pid) {
  _olRotate[pid] = (_olRotate[pid] || 0) + 1;
  render();
}
function cardOneLiners(person, f, viewer, n) {
  n = n || 2;
  if (!viewer || viewer.id === person.id) return [];
  const ctx = getPersonCtx(person, f);
  const vHon = honmeiStar(viewer.birth);
  const rel = starRelation(vHon, f.engines.honmei);
  const tone = toneFromRelation(rel);
  ctx.kinds = KIND_POOLS[tone.kind] || ctx.kinds;
  // ローテに応じて salt をずらす → ↻押下で別候補に
  const rotate = _olRotate[person.id] || 0;
  const start = rotate * 7;
  const seen = new Set();
  const out = [];
  for (let i = start; i < start + 18 && out.length < n; i++) {
    const top = pickWordsWeighted(WANT_WORDS, person, f, viewer, 1, ctx, 'ol' + i);
    if (!top.length) continue;
    const key = top[0].text;
    if (seen.has(key)) continue;
    // 2件目以降は別カテゴリを優先 (軸を分ける)
    if (out.length && out.some(o => o.cat === top[0].cat)) continue;
    seen.add(key);
    out.push({ ...top[0], tone });
  }
  // 別カテゴリ縛りで埋まらなければ重複だけ排除して埋める
  if (out.length < n) {
    for (let i = start; i < start + 18 && out.length < n; i++) {
      const top = pickWordsWeighted(WANT_WORDS, person, f, viewer, 1, ctx, 'ol' + i);
      if (top.length && !seen.has(top[0].text)) {
        seen.add(top[0].text);
        out.push({ ...top[0], tone });
      }
    }
  }
  return out;
}
// 後方互換 (使ってる箇所が出てきても壊れないように)
function cardOneLiner(person, f, viewer) {
  const arr = cardOneLiners(person, f, viewer, 1);
  return arr[0] || null;
}

function renderWords(p, f) {

  // viewer→p の関係でトーン (案C)
  let toneNote = '自分の言葉として';
  if (viewer.id !== p.id) {

  const moodHint = f.total >= 72 ? '攻めの言葉が効く日' : f.total >= 50 ? 'やわらかな言葉が効く日' : '労いの言葉が効く日';

  const wantPick  = pickWordsWeighted(WANT_WORDS,  p, f, viewer, 8, ctx);
  const avoidPick = pickWordsWeighted(AVOID_WORDS, p, f, viewer, 8, ctx);

  const wantTotal  = instanceCountWords(WANT_WORDS, ctx);
  const avoidTotal = instanceCountWords(AVOID_WORDS, ctx);

  // カテゴリ別ブラウズ用
  const wantCats  = [...new Set(WANT_WORDS.map(x => x[0]))];
  const avoidCats = [...new Set(AVOID_WORDS.map(x => x[0]))];
  const weights = categoryWeights(p, f, viewer);
  const topWantCats = Object.entries(weights.want).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k} ×${v.toFixed(1)}`).join(' / ');

  return `
    <div class="words-hero">
      <div class="wh-label">For ${p.name} — Today</div>
      <div class="wh-title">${f.dateStr} ・ ${f.engines.curTerm.name} ・ ${moodHint}</div>
      <div class="wh-sub">${KYUSEI[f.engines.honmei].name} / ${f.engines.dayP.ganzhi} / ${p.blood||'?'}型 / ${f.mbti} / 今日「${f.engines.todayTongbian}」</div>
      <div class="wh-sub" style="margin-top:4px">語気: ${toneNote}</div>
      <div class="wh-sub" style="margin-top:4px;color:var(--fg)">重み上位カテゴリ: ${topWantCats}</div>
    </div>

    <div class="words-cols">
      <div class="words-col want">
        <div class="wc-head">
          <span>かけて欲しい言葉</span>
          <span class="wc-mini">${wantTotal.toLocaleString()} 通り中 8選</span>
        </div>
        <div class="word-list">
          ${wantPick.map(w => `
            <div class="word-card want">
              <span class="wc-quote-l">「</span>${w.text}<span class="wc-quote-r">」</span>
              <span class="wc-cat">${w.cat}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="words-col avoid">
        <div class="wc-head">
          <span>かけられたくない言葉</span>
          <span class="wc-mini">${avoidTotal.toLocaleString()} 通り中 8選</span>
        </div>
        <div class="word-list">
          ${avoidPick.map(w => `
            <div class="word-card avoid">
              <span class="wc-quote-l">「</span>${w.text}<span class="wc-quote-r">」</span>
              <span class="wc-cat">${w.cat}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="words-stats">
      <div>ベースフレーズ: ${WANT_WORDS.length + AVOID_WORDS.length}</div>
      <div>カテゴリ: ${wantCats.length + avoidCats.length}</div>
      <div>差込みインスタンス総数: <b style="color:var(--fg)">${(wantTotal + avoidTotal).toLocaleString()}</b></div>
      <div>日付シード: ${f.dateStr.replace(/-/g,'')}</div>
    </div>

    <div class="words-browse">
      <div class="wb-head">カテゴリ別 — かけて欲しい (重みの高い順)</div>
      ${[...wantCats].sort((a,b) => (weights.want[b]||1) - (weights.want[a]||1)).map(cat => {
        const items = WANT_WORDS.filter(x => x[0] === cat);
        const w = (weights.want[cat]||1).toFixed(1);
        return `<div style="margin-bottom:12px">
          <span class="cat-chip active" style="margin-right:8px">${cat} ×${w}</span>
          <span style="font-size:11px;color:var(--muted)">${items.length}件</span>
          <div style="margin-top:6px;font-size:12px;line-height:2;font-family:var(--serif)">
            ${items.map(([_, t], i) => `「${fillSlots(t, i*13 + hash(cat), ctx)}」`).join('　/　')}
          </div>
        </div>`;
      }).join('')}

      <div class="wb-head">カテゴリ別 — かけられたくない (重みの高い順)</div>
      ${[...avoidCats].sort((a,b) => (weights.avoid[b]||1) - (weights.avoid[a]||1)).map(cat => {
        const items = AVOID_WORDS.filter(x => x[0] === cat);
        const w = (weights.avoid[cat]||1).toFixed(1);
        return `<div style="margin-bottom:12px">
          <span class="cat-chip active" style="margin-right:8px;background:var(--bad);color:var(--bg2);border-color:var(--bad)">${cat} ×${w}</span>
          <span style="font-size:11px;color:var(--muted)">${items.length}件</span>
          <div style="margin-top:6px;font-size:12px;line-height:2;font-family:var(--serif);color:#5a5a55">
            ${items.map(([_, t], i) => `「${fillSlots(t, i*13 + hash(cat), ctx)}」`).join('　/　')}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

(function spawnParticles() {
  const root = document.getElementById('particles');
  if (!root) return;
  const N = 28;
  for (let i = 0; i < N; i++) {
    const p = document.createElement('div');
    p.className = 'p';
    const left = Math.random() * 100;
    const top  = 100 + Math.random() * 20;       // start below viewport
    const dur  = 14 + Math.random() * 22;        // 14-36s
    const delay = -Math.random() * dur;          // negative so they spread
    const size = 2 + Math.random() * 3;
    p.style.left = left + 'vw';
    p.style.top = top + 'vh';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.setProperty('--p-op', (0.15 + Math.random() * 0.3).toFixed(2));
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = delay + 's';
    root.appendChild(p);
  }
})();

// 占術タブ (URANAI nav) → 該当する内部タブを開いて DETAIL までスクロール
const NAV_TO_INNER = {
  '星占': 'astro', '塔羅': 'iching', '数秘': 'num', '易経': 'iching',
  '四柱': 'shichu', '風水': 'fengshui', 'MBTI': 'mbti',
};
function syncEdTabsActive() {
  document.querySelectorAll('#edTabs .ed-tab').forEach(b => {
    const inner = NAV_TO_INNER[b.textContent.trim()];
    b.classList.toggle('active', inner === activeTab);

}

    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === inner));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + inner));

  document.getElementById('sec-detail')?.scrollIntoView({ behavior:'smooth', block:'start' });
});

// 詳細パネル: 左右スワイプで前後のタブへ
(function bindSwipe() {
  const detail = document.getElementById('sec-detail');
  if (!detail) return;
  const TAB_ORDER = ['overview','shichu','astro','num','fengshui','iching','mbti','words'];
  let sx = 0, sy = 0, sw = 0;
  detail.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; sw = e.timeStamp;
  }, { passive: true });
  detail.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    const dt = e.timeStamp - sw;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || dt > 700) return;
    const idx = TAB_ORDER.indexOf(activeTab);
    if (idx < 0) return;
    const ni = dx < 0 ? Math.min(TAB_ORDER.length-1, idx+1) : Math.max(0, idx-1);
    if (ni === idx) return;
    activeTab = TAB_ORDER[ni];
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + activeTab));
    syncEdTabsActive();
    render();
  }, { passive: true });
})();

if (!PEOPLE.find(p => p.id === selectedId)) selectedId = (PEOPLE.find(p => p.center) || PEOPLE[0] || {}).id || '';
render();

// ============================================================
// MOTION LAYER (日本最先端モーション — 既存デザインを崩さない味付け)
// ============================================================
const _mm = typeof matchMedia === 'function' ? matchMedia : () => ({ matches: false });
const PREFERS_REDUCED = _mm('(prefers-reduced-motion: reduce)').matches;
const FINE_POINTER    = _mm('(pointer: fine)').matches;

// ---- 1) ヘッドライン: 文字スプリット & ステージドフェード ----
let _lastHeadlineText = '';
function splitHeadline() {
  if (PREFERS_REDUCED) return;
  const $hl = document.getElementById('edHeadline');
  if (!$hl) return;
  const lines = [...$hl.querySelectorAll('.hl-line')];
  if (!lines.length) return;
  const sig = lines.map(l => l.textContent).join('|');
  // 既に分割済み + 同じテキストなら再生しない (チラつき防止)
  const alreadySplit = !!$hl.querySelector('.hl-char');
  if (alreadySplit && sig === _lastHeadlineText) return;
  _lastHeadlineText = sig;
  let n = 0;
  lines.forEach((line, li) => {
    const text = line.textContent;
    const chars = [...text];
    line.innerHTML = chars.map(c => {
      if (c === ' ') return '<span class="hl-char" style="width:0.28em">&nbsp;</span>';
      const delay = (n++ * 26 + li * 80);
      return `<span class="hl-char" style="animation-delay:${delay}ms">${c}</span>`;
    }).join('');
  });
}

// ---- 2) スコア / 数値のスクランブル + カウントアップ ----
function animateCounter(el, target, opts) {
  if (!el) return;
  if (PREFERS_REDUCED) { el.textContent = target; return; }
  const dur = (opts && opts.dur) || 1100;
  const scrambleDur = dur * 0.45;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const start = performance.now();
  const from = parseFloat(el.dataset.cur || '0') || 0;
  if (from === target) { el.textContent = target; return; }
  const tgt = Math.abs(target);
  const scrambleMax = Math.max(99, tgt * 2 + 9);
  function step(now) {
    if (now - start < scrambleDur) {
      // 高速ランダム数字 (Matrix風)
      el.textContent = Math.floor(Math.random() * scrambleMax);
      requestAnimationFrame(step);
      return;
    }
    const t = Math.min(1, (now - start - scrambleDur) / (dur - scrambleDur));
    const v = from + (target - from) * ease(t);
    el.textContent = Math.round(v);
    if (t < 1) requestAnimationFrame(step);
    else el.dataset.cur = target;
  }
  requestAnimationFrame(step);
}
function animateAllCounters(root) {
  root = root || document;
  // gauge / card / strip / cm / vc
  root.querySelectorAll('.gauge-num, .card-score, .ed-strip-cell .val, .cm-val, .vc-score, .bar-val')
    .forEach(el => {
      const m = (el.textContent || '').match(/-?\d+(?:\.\d+)?/);
      if (!m) return;
      const v = parseFloat(m[0]);
      if (!isFinite(v)) return;
      animateCounter(el, v, { dur: 800 });
    });
}

// ---- 3) スクロール連動リビール (IntersectionObserver) ----
const revealObs = (() => {
  if (PREFERS_REDUCED || typeof IntersectionObserver === 'undefined') return null;
  return new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('is-in');
        revealObs.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
})();
function bindReveals() {
  if (!revealObs) return;
  // .ed-strip-cell のみ対象 (他は既存fadeUpと競合するため)
  document.querySelectorAll('.ed-strip-cell').forEach((el, i) => {
    if (el.classList.contains('is-in')) return;
    if (!el.classList.contains('reveal')) {
      el.classList.add('reveal');
      el.style.setProperty('--i', i.toString());
    }
    revealObs.observe(el);
  });
}

// ---- 4) マグネティックホバー (PCのみ; ピル形ボタン群) ----
function bindMagnetic() {
  if (PREFERS_REDUCED || !FINE_POINTER) return;
  const sel = '.ed-tab, .vc-chip, .ed-date-pill, .ed-reading-tag';
  document.querySelectorAll(sel).forEach(el => {
    if (el.dataset.magbound) return;
    el.dataset.magbound = '1';
    let frame = 0;
    el.addEventListener('mousemove', (e) => {
      const r = el.getBoundingClientRect();
      const dx = (e.clientX - (r.left + r.width / 2)) / r.width;
      const dy = (e.clientY - (r.top + r.height / 2)) / r.height;
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        el.style.transform = `translate(${dx * 8}px, ${dy * 6}px)`;
      });
    });
    el.addEventListener('mouseleave', () => {
      cancelAnimationFrame(frame);
      el.style.transform = '';
    });
  });
}

// ---- 5) カーソルチェイサー (PCのみ) ----
(function cursorChaser() {
  if (PREFERS_REDUCED || !FINE_POINTER) return;
  const dot = document.createElement('div');
  dot.className = 'cursor-chaser';
  document.body.appendChild(dot);
  let x = -100, y = -100, tx = -100, ty = -100;
  document.addEventListener('mousemove', e => {
    tx = e.clientX; ty = e.clientY;
    dot.style.opacity = 0.9;
  });
  document.addEventListener('mouseleave', () => { dot.style.opacity = 0; });
  function loop() {
    x += (tx - x) * 0.22;
    y += (ty - y) * 0.22;
    dot.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  // hot zones — pill類に乗ると拡大
  const hotSel = 'button, a, .vc-chip, .ed-tab, .card, .ed-strip-cell, .word-card, .tab';
  document.addEventListener('mouseover', e => {
    if (e.target.closest(hotSel)) dot.classList.add('is-hot');
  });
  document.addEventListener('mouseout', e => {
    if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest(hotSel)) dot.classList.remove('is-hot');
  });
})();

// 一言ローテボタン (カード選択にイベント伝播させない)
document.addEventListener('click', e => {
  const btn = e.target.closest('.ol-refresh');
  if (!btn) return;
  e.stopPropagation();
  e.preventDefault();
  bumpOneLinerRotate(btn.dataset.pid);

// ---- 6) クリック ★ バースト (黄色+黒の十字が放射状に飛ぶ) ----
document.addEventListener('click', e => {
  if (PREFERS_REDUCED) return;
  // ↻ボタンの click は別途処理してるので除外
  if (e.target.closest('.ol-refresh')) return;
  const target = e.target.closest('.vc-chip, .ed-tab, .tab, .card, .ed-strip-cell, .btn, .ed-headline, .marquee-block');
  if (!target) return;
  const N = 7;
  for (let i = 0; i < N; i++) {
    const star = document.createElement('span');
    const yellow = i % 2 === 0;
    star.className = 'click-star' + (yellow ? ' is-yellow' : '');
    star.style.left = e.clientX + 'px';
    star.style.top  = e.clientY + 'px';
    const angle = (i / N) * Math.PI * 2 + Math.random() * 0.3;
    const dist  = 60 + Math.random() * 80;
    star.style.setProperty('--fx', (Math.cos(angle) * dist).toFixed(1) + 'px');
    star.style.setProperty('--fy', (Math.sin(angle) * dist).toFixed(1) + 'px');
    star.style.animation = `starFly ${600 + Math.random() * 300}ms cubic-bezier(0.22,0.61,0.36,1) both`;
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 1000);
  }
});

// ---- 7) マウススポットライト (黄色オーラが追従) ----
(function spotlight() {
  if (PREFERS_REDUCED || !FINE_POINTER) return;
  const sp = document.createElement('div');
  sp.className = 'mouse-spotlight';
  document.body.appendChild(sp);
  let tx = -9999, ty = -9999, x = tx, y = ty;
  document.addEventListener('mousemove', e => {
    tx = e.clientX; ty = e.clientY;
    sp.classList.add('is-on');
  });
  document.addEventListener('mouseleave', () => sp.classList.remove('is-on'));
  function loop() {
    x += (tx - x) * 0.18;
    y += (ty - y) * 0.18;
    sp.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

// ---- 8) スクロールパララックス ----
(function parallax() {
  if (PREFERS_REDUCED) return;
  let ticking = false;
  const apply = () => {
    const y = window.scrollY || window.pageYOffset || 0;
    const $hl = document.getElementById('edHeadline');
    const $st = document.querySelector('.ed-explore-stamp');
    if ($hl) $hl.style.transform = `translateX(${Math.min(y * 0.18, 80)}px)`;
    if ($st) $st.style.transform = `translateY(${-y * 0.35}px)`;
    ticking = false;
  };
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(apply); ticking = true; }
  }, { passive: true });
})();

// ---- 9) オープニング演出 (黒幕→水平に分割して上下へ消える) ----
(function opening() {
  if (PREFERS_REDUCED) return;
  // すでに表示済みなら出さない (ページ内遷移想定)
  if (sessionStorage.getItem('uranai_opened') === '1') return;
  try { sessionStorage.setItem('uranai_opened', '1'); } catch {}
  const curtain = document.createElement('div');
  curtain.className = 'opening-curtain';
  curtain.innerHTML = `
    <div class="opening-mark">URANAI</div>
    <div class="opening-meta">私的占断 — TODAY'S READING</div>
    <div class="opening-meta-r">EDITORIAL ／ ${todayStr()}</div>
  `;
  document.body.appendChild(curtain);
  // ロック解除: 動作開始
  setTimeout(() => {
    curtain.classList.add('is-out');
    // ヘッドラインを再分割 (アニメ再生)
    setTimeout(() => {
      _lastHeadlineText = '';
      document.querySelectorAll('#edHeadline .hl-line').forEach(l => { l.textContent = l.textContent; });
      splitHeadline();
    }, 200);
    setTimeout(() => curtain.remove(), 1100);
  }, 900);
})();

// ---- render() に乗っかる: 描画後の演出 ----
const origRender = render;
let _firstRenderDone = false;
render = function() {
  origRender();
  splitHeadline(); // テキスト変化があれば文字スプリット
  bindReveals();   // 新しい strip-cell があれば observer に登録
  bindMagnetic();  // 新しい pill 要素に bind
  // カウントアップは初回のみ (再描画でチラつくのを防ぐ)
  if (!_firstRenderDone) {
    requestAnimationFrame(() => animateAllCounters(document));
    _firstRenderDone = true;
  }
};
// 初回適用
splitHeadline();
requestAnimationFrame(() => { animateAllCounters(document); _firstRenderDone = true; });
bindReveals();
bindMagnetic();
</script>
