<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>吉田占いダッシュボード</title>
<style>
  /* === 4WIDE-inspired: 七宝文様 + monochrome + serif === */
  :root {
    --bg:     #ebe9e4;            /* base canvas (warm gray) */
    --bg2:    #ffffff;            /* cards */
    --bg3:    #f4f2ec;            /* nested */
    --fg:     #15151a;            /* near black */
    --fg2:    #2a2a30;
    --muted:  #7a7a78;
    --accent: #15151a;            /* monochrome accent */
    --line:   #cfcdc6;
    --line2:  #e4e1d9;
    --good:   #3d5e44;            /* desaturated moss */
    --mid:    #8a7240;            /* aged brass */
    --bad:    #8c3a3a;            /* muted brick */
    --serif:  "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Times New Roman", serif;
    --sans:   -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--fg);
    min-height: 100vh;
    /* 七宝文様 SVG パターン (Shippō tsunagi) */
    background-color: var(--bg);
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><g fill='none' stroke='%23c7c4bb' stroke-width='0.7'><circle cx='40' cy='40' r='28.28'/><circle cx='0' cy='0' r='28.28'/><circle cx='80' cy='0' r='28.28'/><circle cx='0' cy='80' r='28.28'/><circle cx='80' cy='80' r='28.28'/></g></svg>"),
      radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.5), transparent 60%);
    background-size: 80px 80px, 100% 100%;
    background-attachment: fixed, scroll;
    letter-spacing: 0.01em;
  }
  header {
    padding: 28px 40px 18px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 16px;
    background: rgba(235,233,228,0.65);
    backdrop-filter: blur(8px);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.1;
  }
  h1 .brand-mark {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--muted);
    font-family: var(--sans);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  h1 .ja-sub {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    font-family: var(--sans);
    letter-spacing: 0.05em;
  }
  .date-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .date-bar input[type=date] {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 0;
    padding: 8px 10px; font-family: var(--sans);
    color-scheme: light; font-size: 12px;
  }
  .btn {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 0;
    padding: 8px 16px; cursor: pointer; font-family: var(--sans);
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
  }
  .btn:hover { background: var(--fg); color: var(--bg2); border-color: var(--fg); }
  .btn-primary { background: var(--fg); color: var(--bg2); border-color: var(--fg); font-weight: 500; }
  .btn-primary:hover { background: var(--bg2); color: var(--fg); }
  .btn-danger  { color: var(--bad); border-color: var(--bad); }
  .btn-danger:hover { background: var(--bad); color: var(--bg2); border-color: var(--bad); }
  main {
    display: grid;
    grid-template-columns: minmax(440px, 1fr) 400px;
    gap: 24px;
    padding: 28px 40px 80px;
    max-width: 1500px;
    margin: 0 auto;
  }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 24px;
  }
  .panel-wide { grid-column: 1 / -1; }
  .panel h2 {
    margin: 0 0 16px;
    font-size: 10px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line2);
  }
  .radial-wrap { aspect-ratio: 1 / 1; width: 100%; }
  svg { width: 100%; height: 100%; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .cards { display: flex; flex-direction: column; gap: 1px; max-height: 640px; overflow-y: auto; background: var(--line2); }
  .card {
    background: var(--bg2);
    border: none;
    border-radius: 0;
    padding: 14px 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .card:hover { background: var(--bg3); }
  .card.selected { background: var(--fg); color: var(--bg2); }
  .card.selected .card-role,
  .card.selected .bar,
  .card.selected .bar-val,
  .card.selected .card-foot { color: rgba(255,255,255,0.75); }
  .card.selected .bar-track { background: rgba(255,255,255,0.15); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .card-name { font-family: var(--serif); font-weight: 500; font-size: 17px; letter-spacing: 0.02em; }
  .card-role { font-size: 10px; color: var(--muted); margin-left: 8px; letter-spacing: 0.05em; }
  .card-score { font-family: var(--serif); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .bars { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .bar { display: grid; grid-template-columns: 38px 1fr 26px; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
  .bar-track { height: 1px; background: var(--line); border-radius: 0; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 0; transition: width 0.4s ease; }
  .bar-val { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; font-family: var(--serif); }
  .card-foot { margin-top: 6px; font-size: 10px; color: var(--muted); letter-spacing: 0.05em; }
  /* Tabs */
  .tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .tab {
    background: none; border: none;
    color: var(--muted);
    padding: 12px 18px; cursor: pointer;
    font-family: var(--sans);
    font-size: 11px; letter-spacing: 0.15em;
    text-transform: uppercase;
    border-bottom: 1px solid transparent;
    margin-bottom: -1px;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab:hover { color: var(--fg); }
  .tab.active { color: var(--fg); border-bottom-color: var(--fg); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  /* Grid layouts within tabs */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 720px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  .box {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 0; padding: 22px;
  }
  .box h3 {
    margin: 0 0 16px;
    font-family: var(--serif);
    font-size: 18px; color: var(--fg);
    font-weight: 500; letter-spacing: 0.02em;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line2);
  }
  .box h4 {
    margin: 16px 0 8px;
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.2em;
    font-weight: 500;
  }
  .row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; gap: 8px; border-bottom: 1px dotted var(--line2); }
  .row:last-child { border-bottom: none; }
  .row > span:first-child { color: var(--muted); flex-shrink: 0; font-size: 11px; letter-spacing: 0.05em; }
  .row > span:last-child { text-align: right; font-family: var(--serif); }
  .pillar-table {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1px; margin: 14px 0;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .pillar-cell {
    background: var(--bg2); padding: 14px 6px; border-radius: 0;
    text-align: center; font-size: 12px;
  }
  .pillar-cell .pillar-label {
    color: var(--muted); font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase;
    font-family: var(--sans);
  }
  .pillar-cell .pillar-stem {
    font-family: var(--serif);
    font-size: 30px; font-weight: 400; color: var(--fg);
    display: block; margin-top: 8px;
  }
  .pillar-cell .pillar-branch {
    font-family: var(--serif);
    font-size: 30px; font-weight: 400; color: var(--fg2);
    display: block;
  }
  .pillar-cell .pillar-meta {
    font-size: 9px; color: var(--muted);
    margin-top: 6px; line-height: 1.5;
    font-family: var(--sans);
  }
  .chip {
    background: var(--bg3);
    color: var(--fg);
    padding: 4px 12px; border-radius: 0;
    font-size: 10px; letter-spacing: 0.1em;
    display: inline-block; margin: 2px;
    border: 1px solid var(--line);
  }
  .chip-mini {
    background: var(--bg3); color: var(--fg);
    padding: 3px 8px; border-radius: 0;
    font-size: 10px; margin: 2px;
    display: inline-block;
    border: 1px solid var(--line2);
    font-family: var(--sans);
    letter-spacing: 0.05em;
  }
  .advice {
    margin-top: 14px; padding: 14px 16px;
    background: var(--bg3);
    border-left: 2px solid var(--fg);
    border-radius: 0;
    font-size: 13px; line-height: 1.8;
    font-family: var(--serif);
  }
  .narrative {
    font-size: 13px; line-height: 1.85; color: var(--fg);
    background: var(--bg2);
    padding: 16px 18px; border-radius: 0;
    border: 1px solid var(--line);
    margin-bottom: 12px;
    font-family: var(--serif);
  }
  .narrative h4 {
    margin: 0 0 8px;
    color: var(--fg); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.2em;
    font-weight: 500;
    font-family: var(--sans);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line2);
  }
  /* Hexagram lines */
  .hex { display: flex; flex-direction: column-reverse; gap: 6px; align-items: center; }
  .hex-line {
    width: 90px; height: 8px; background: var(--fg); border-radius: 0;
    position: relative;
  }
  .hex-line.yin {
    background: transparent;
    box-shadow: -24px 0 0 var(--fg), 24px 0 0 var(--fg);
    width: 38px; height: 8px;
  }
  .hex-line.changing { background: var(--bad); }
  .hex-line.yin.changing { box-shadow: -24px 0 0 var(--bad), 24px 0 0 var(--bad); }
  /* Tarot */
  .tarot-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .tarot-card {
    background: var(--bg2);
    border: 1px solid var(--fg);
    border-radius: 0;
    width: 120px; padding: 14px 10px;
    text-align: center; font-size: 11px;
    box-shadow: 6px 6px 0 var(--line);
    color: var(--fg);
  }
  .tarot-card.reversed { transform: rotate(180deg); }
  .tarot-card .pos { color: var(--muted); font-size: 9px; letter-spacing: 0.2em; margin-bottom: 6px; text-transform: uppercase; }
  .tarot-card .name { font-family: var(--serif); font-size: 14px; font-weight: 500; margin: 8px 0; letter-spacing: 0.02em; }
  .tarot-card .suit { color: var(--muted); font-size: 9px; letter-spacing: 0.1em; }
  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,20,20,0.55);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--line);
    border-radius: 0; padding: 32px;
    width: min(560px, 92vw); max-height: 88vh; overflow-y: auto;
  }
  .modal h2 {
    margin: 0 0 22px;
    font-family: var(--serif);
    font-size: 22px; font-weight: 500;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line2);
  }
  .modal-section { margin-bottom: 24px; }
  .modal-section h3 {
    font-size: 10px; color: var(--muted); margin: 0 0 12px;
    text-transform: uppercase; letter-spacing: 0.25em; font-weight: 500;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 14px; }
  .form-grid label.full { grid-column: 1 / -1; }
  .form-grid label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 10px; color: var(--muted);
    letter-spacing: 0.15em; text-transform: uppercase;
  }
  .form-grid input, .form-grid select {
    background: var(--bg2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 0;
    padding: 10px 12px; font-family: var(--sans);
    font-size: 14px; color-scheme: light;
    text-transform: none; letter-spacing: 0;
  }
  .form-grid input:focus, .form-grid select:focus {
    outline: none; border-color: var(--fg);
  }
  .blood-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .blood-group input { display: none; }
  .blood-group label {
    text-align: center; padding: 10px; border: 1px solid var(--line);
    border-radius: 0; cursor: pointer; font-weight: 500;
    color: var(--fg); font-size: 13px;
    font-family: var(--serif);
    letter-spacing: 0;
    text-transform: none;
  }
  .blood-group input:checked + label {
    background: var(--fg); color: var(--bg2); border-color: var(--fg);
  }
  .check-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; margin-top: 4px;
    color: var(--fg);
    text-transform: none; letter-spacing: 0.02em;
  }
  .modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
  .modal-actions .left, .modal-actions .right { display: flex; gap: 8px; }
  .people-list { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; }
  .person-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center;
    padding: 10px 12px; background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: 0; font-size: 13px;
  }
  .person-row .meta { color: var(--muted); font-size: 10px; letter-spacing: 0.05em; }
  .person-row .ico-btn {
    background: none; border: 1px solid var(--line2);
    color: var(--muted);
    cursor: pointer; padding: 4px 10px;
    font-size: 13px; border-radius: 0;
  }
  .person-row .ico-btn:hover {
    color: var(--bg2); background: var(--fg); border-color: var(--fg);
  }
  .center-badge {
    display: inline-block; background: var(--fg); color: var(--bg2);
    padding: 2px 8px; border-radius: 0;
    font-size: 9px; margin-left: 6px;
    letter-spacing: 0.15em; text-transform: uppercase;
    font-family: var(--sans);
  }
  /* SVG text */
  .node-label { font-family: var(--serif); font-size: 14px; fill: var(--fg); text-anchor: middle; pointer-events: none; font-weight: 500; }
  .node-sub { font-family: var(--sans); font-size: 9px; fill: var(--muted); text-anchor: middle; pointer-events: none; letter-spacing: 0.05em; }
  .node-score { font-family: var(--serif); font-size: 14px; font-weight: 400; text-anchor: middle; pointer-events: none; fill: var(--fg); }
  .link { fill: none; stroke-width: 1; opacity: 0.7; }
  .node-circle { cursor: pointer; transition: r 0.2s; }
  .node-circle.selected { stroke: var(--fg); stroke-width: 2; }
  /* "Focus mode" hero footer (4WIDE-inspired) */
  .hero-foot {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 24px; padding: 32px 0 8px;
    border-top: 1px solid var(--line);
    font-family: var(--serif);
  }
  .hero-foot .hero-tag {
    font-size: 48px; line-height: 1; letter-spacing: 0.02em;
    color: var(--fg); font-weight: 400;
  }
  .hero-foot .hero-tag .small { font-size: 16px; letter-spacing: 0.2em; color: var(--muted); display: block; margin-bottom: 8px; font-family: var(--sans); text-transform: uppercase; }
  .hero-foot .hero-meta {
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.15em;
    font-family: var(--sans);
    text-align: right;
    line-height: 1.8;
  }
  @media (max-width: 720px) {
    h1 { font-size: 24px; }
    main { padding: 20px; }
    .hero-foot .hero-tag { font-size: 32px; }
  }
</style>
</head>
<body>
<header>
  <h1>
    <span class="brand-mark">KA — 吉田占断</span>
    占いダッシュボード
    <span class="ja-sub">Built with Stars &amp; Craft — 仕事仲間との今日の運勢</span>
  </h1>
  <div class="date-bar">
    <input type="date" id="dateInput">
    <button class="btn" id="todayBtn">Today</button>
    <button class="btn btn-primary" id="manageBtn">+ Register</button>
  </div>
</header>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">人物の登録</h2>
    <div class="modal-section">
      <h3>新規登録 / 編集</h3>
      <form id="regForm">
        <input type="hidden" id="fId">
        <div class="form-grid">
          <label class="full">名前
            <input type="text" id="fName" required maxlength="30" placeholder="例: 山田 太郎">
          </label>
          <label class="full">役割・関係
            <input type="text" id="fRole" maxlength="40" placeholder="例: 同僚 / 開発">
          </label>
          <label>生年月日
            <input type="date" id="fBirth" required min="1900-01-01" max="2025-12-31">
          </label>
          <label>出生時刻 (任意)
            <input type="number" id="fHour" min="0" max="23" step="1" placeholder="0-23">
          </label>
          <label>性別
            <select id="fGender">
              <option value="male">男性</option>
              <option value="female">女性</option>
            </select>
          </label>
          <label>血液型
            <div class="blood-group">
              <input type="radio" name="blood" id="bA" value="A"><label for="bA">A型</label>
              <input type="radio" name="blood" id="bB" value="B"><label for="bB">B型</label>
              <input type="radio" name="blood" id="bO" value="O"><label for="bO">O型</label>
              <input type="radio" name="blood" id="bAB" value="AB"><label for="bAB">AB型</label>
            </div>
          </label>
          <label class="full check-row">
            <input type="checkbox" id="fCenter"> 中心人物にする（占いの基準）
          </label>
        </div>
        <div class="modal-actions">
          <div class="left">
            <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none">削除</button>
          </div>
          <div class="right">
            <button type="button" class="btn" id="resetFormBtn">クリア</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">登録する</button>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-section">
      <h3>登録済み</h3>
      <div class="people-list" id="peopleList"></div>
    </div>
    <div class="modal-actions">
      <div class="left">
        <button type="button" class="btn btn-danger" id="resetAllBtn">全リセット</button>
      </div>
      <div class="right">
        <button type="button" class="btn btn-primary" id="closeBtn">閉じる</button>
      </div>
    </div>
  </div>
</div>

<main>
  <section class="panel">
    <h2>RELATIONSHIP MAP</h2>
    <div class="radial-wrap">
      <svg id="radial" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--good)"></span>大吉 (80+)</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--mid)"></span>中吉 (50-79)</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--bad)"></span>要注意 (-49)</div>
      <div class="legend-item">線の太さ・色 = 中心との相性</div>
    </div>
  </section>

  <section class="panel">
    <h2>TEAM FORECAST</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section class="panel panel-wide">
    <h2>DETAIL — <span id="detailName">—</span></h2>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="shichu">四柱</button>
      <button class="tab" data-tab="astro">天体</button>
      <button class="tab" data-tab="num">数秘</button>
      <button class="tab" data-tab="fengshui">風水</button>
      <button class="tab" data-tab="iching">易・Tarot</button>
      <button class="tab" data-tab="mbti">MBTI・統合</button>

function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); }
function fmtDate(d) { const dt = new Date(d); return dt.toISOString().slice(0,10); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function digitSum(n) { let s=0; while(n>0){ s += n%10; n=(n-n%10)/10; } return s; }
function reduce1to9(n) { while (n > 9) n = digitSum(n); return n; }
function reduceKeepMaster(n) { while (n > 9 && n !== 11 && n !== 22 && n !== 33) n = digitSum(n); return n; }
function hash(str) { let h=2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = (h*16777619)>>>0; } return h; }
function lcgSeed(seed) { let s = seed >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 0xffffffff; }; }

// julianDay (Meeus)
function julianDay(date) {
  const d = new Date(date);
  let Y = d.getUTCFullYear(), M = d.getUTCMonth()+1;
  const D = d.getUTCDate() + (d.getUTCHours() + d.getUTCMinutes()/60)/24;
  if (M <= 2) { Y -= 1; M += 12; }
  const A = Math.floor(Y/100), B = 2 - A + Math.floor(A/4);
  return Math.floor(365.25*(Y+4716)) + Math.floor(30.6001*(M+1)) + D + B - 1524.5;
}

function rad(d) { return d * Math.PI / 180; }
function deg(r) { return r * 180 / Math.PI; }
function mod360(x) { return ((x % 360) + 360) % 360; }

// 太陽黄経 (Meeus)
function sunLongitude(date) {
  const JD = julianDay(date);
  const T = (JD - 2451545.0) / 36525;
  const L0 = mod360(280.46646 + 36000.76983*T + 0.0003032*T*T);
  const M  = mod360(357.52911 + 35999.05029*T - 0.0001537*T*T);
  const C = (1.914602 - 0.004817*T - 0.000014*T*T) * Math.sin(rad(M))
          + (0.019993 - 0.000101*T) * Math.sin(rad(2*M))
          + 0.000289 * Math.sin(rad(3*M));
  return mod360(L0 + C);
}

// 月黄経 (ELP2000 簡易)
function moonLongitude(date) {
  const JD = julianDay(date);
  const T = (JD - 2451545.0) / 36525;
  const Lp = mod360(218.3164477 + 481267.88123421*T - 0.0015786*T*T);
  const D  = mod360(297.8501921 + 445267.1114034*T - 0.0018819*T*T);
  const M  = mod360(357.5291092 + 35999.0502909*T - 0.0001536*T*T);
  const Mp = mod360(134.9633964 + 477198.8675055*T + 0.0087414*T*T);
  const F  = mod360(93.2720950  + 483202.0175233*T - 0.0036539*T*T);
  let sum = 0;
  sum += 6.288774 * Math.sin(rad(Mp));
  sum += 1.274027 * Math.sin(rad(2*D - Mp));
  sum += 0.658314 * Math.sin(rad(2*D));
  sum += 0.213618 * Math.sin(rad(2*Mp));
  sum -= 0.185116 * Math.sin(rad(M));
  sum -= 0.114332 * Math.sin(rad(2*F));
  sum += 0.058793 * Math.sin(rad(2*D - 2*Mp));
  sum += 0.057066 * Math.sin(rad(2*D - M - Mp));
  sum += 0.053322 * Math.sin(rad(2*D + Mp));
  sum += 0.045758 * Math.sin(rad(2*D - M));
  sum -= 0.040923 * Math.sin(rad(M - Mp));
  sum -= 0.034720 * Math.sin(rad(D));
  return mod360(Lp + sum);
}

function moonPhase(date) {
  const diff = mod360(moonLongitude(date) - sunLongitude(date));
  const phase = diff / 360;
  const age = phase * 29.530589;
  let label = '十六夜（欠けゆく月）', emoji = '🌖';
  for (const [a,b,n,e] of MOON_PHASES) {
    if (a > b) { if (phase >= a || phase < b) { label=n; emoji=e; break; } }
    else { if (phase >= a && phase < b) { label=n; emoji=e; break; } }
  }
  return { phase, age, label, emoji, diff };
}

// 24節気 (bisection)
function findSolarTermDate(year, lon) {
  const target = mod360(lon);
  let lo = new Date(Date.UTC(year - 1, 11, 15));
  let hi = new Date(Date.UTC(year + 1, 0, 31));
  for (let i = 0; i < 40; i++) {
    const mid = new Date((lo.getTime() + hi.getTime()) / 2);
    const ml = sunLongitude(mid);
    const diff = mod360(ml - target);
    if (diff > 180) lo = mid; else hi = mid;
  }
  return new Date((lo.getTime() + hi.getTime()) / 2);
}
function solarTermsOfYear(year) {
  return SOLAR_TERMS.map(([lon, name, m]) => ({ lon, name, main: m === 'main', date: findSolarTermDate(year, lon) }));
}

function getSunSign(month, day) {
  for (const [n, fm, fd, tm, td] of ZODIAC) {
    if (fm > tm) { if ((month === fm && day >= fd) || (month === tm && day <= td)) return n; }
    else if ((month === fm && day >= fd) || (month === tm && day <= td) || (month > fm && month < tm)) return n;
  }
  return ZODIAC[0][0];
}

// 年柱: 立春前は前年扱い
function yearPillar(birth) {
  const y = effectiveYear(birth);
  const stemIdx = ((y - 4) % 10 + 10) % 10;
  const branchIdx = ((y - 4) % 12 + 12) % 12;
  return { stem: STEMS[stemIdx], branch: BRANCHES[branchIdx], stemIdx, branchIdx, ganzhi: STEMS[stemIdx]+BRANCHES[branchIdx] };
}
// 月柱: 節入り (簡易: 各月の節入り日を-2/3/4近辺で判定)
const SETSU_DAYS = [
  // [月支index from 寅=0, 月開始(月,日)]

  [11, 1,  20], // 子→丑は小寒 1/5頃 ※下のloopで

// より正確: 各節気日と月支対応
// 月支マッピング (節気main12): 立春→寅, 啓蟄→卯, 清明→辰, 立夏→巳, 芒種→午, 小暑→未, 立秋→申, 白露→酉, 寒露→戌, 立冬→亥, 大雪→子, 小寒→丑
const MONTH_BRANCH_FROM_TERM = ['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
function monthPillar(birth) {
  const d = parseDate(birth);
  const year = d.getUTCFullYear();
  // 節入り (main 12) のリストを当年と前年で取得
  const allTerms = [];
  [year-1, year, year+1].forEach(y => {
    SOLAR_TERMS.forEach(([lon, name, m]) => {
      if (m === 'main') allTerms.push({ year:y, lon, name, date: findSolarTermDate(y, lon) });
    });
  });
  allTerms.sort((a,b) => a.date - b.date);
  // 月支マッピング順: 立春=寅, 啓蟄=卯, 清明=辰, ..., 小寒=丑
  const TERM_TO_BRANCH = { '立春':'寅','啓蟄':'卯','清明':'辰','立夏':'巳','芒種':'午','小暑':'未','立秋':'申','白露':'酉','寒露':'戌','立冬':'亥','大雪':'子','小寒':'丑' };
  // 出生日以前の最後のmain節気
  let last = allTerms[0];
  for (const t of allTerms) { if (t.date <= d) last = t; else break; }
  const monthBranch = TERM_TO_BRANCH[last.name];
  const branchIdx = BRANCHES.indexOf(monthBranch);
  // 月干: 五虎遁
  const yp = yearPillar(birth);
  const tigerStem = WUGOLUEN[yp.stem]; // 寅月の月干
  const tigerStemIdx = STEMS.indexOf(tigerStem);
  // 寅=0番目, 月支index in MONTH_BRANCH_FROM_TERM
  const monthOrder = MONTH_BRANCH_FROM_TERM.indexOf(monthBranch);
  const stemIdx = (tigerStemIdx + monthOrder) % 10;
  return { stem: STEMS[stemIdx], branch: monthBranch, stemIdx, branchIdx, ganzhi: STEMS[stemIdx]+monthBranch, termName: last.name };
}
// 日柱
function dayPillar(birth) {
  const d = parseDate(birth);
  const days = daysSince1900(d);
  const stemIdx = ((2 + days) % 10 + 10) % 10;
  const branchIdx = ((10 + days) % 12 + 12) % 12;
  return { stem: STEMS[stemIdx], branch: BRANCHES[branchIdx], stemIdx, branchIdx, ganzhi: STEMS[stemIdx]+BRANCHES[branchIdx] };
}
// 時柱
function hourPillar(dayStem, hour) {
  if (hour == null) return null;
  // 時支: 子=23-1, 丑=1-3, ... 亥=21-23
  let bIdx;
  if (hour >= 23 || hour < 1) bIdx = 0;
  else bIdx = Math.floor((hour + 1) / 2);
  const zeroStem = WUSHUTEN[dayStem]; // 子時の干
  const zeroIdx = STEMS.indexOf(zeroStem);
  const stemIdx = (zeroIdx + bIdx) % 10;
  return { stem: STEMS[stemIdx], branch: BRANCHES[bIdx], stemIdx, branchIdx: bIdx, ganzhi: STEMS[stemIdx]+BRANCHES[bIdx] };
}
// 通変星
function tongbianStar(dayStemIdx, otherStemIdx) {
  if (otherStemIdx == null) return '';
  const eOrder = ['木','火','土','金','水'];
  const eA = STEM_ELEMENTS[dayStemIdx], eB = STEM_ELEMENTS[otherStemIdx];
  const yA = STEM_YINYANG[dayStemIdx], yB = STEM_YINYANG[otherStemIdx];
  const same = yA === yB;
  const iA = eOrder.indexOf(eA), iB = eOrder.indexOf(eB);
  if (iA === iB) return same ? '比肩' : '劫財';
  if ((iA + 1) % 5 === iB) return same ? '食神' : '傷官';       // 日干生
  if ((iA + 2) % 5 === iB) return same ? '偏財' : '正財';       // 日干剋
  if ((iB + 1) % 5 === iA) return same ? '偏印' : '印綬';       // 被生
  return same ? '偏官' : '正官';                                  // 被剋
}
// 十二運
function twelveStage(dayStem, branch) {
  const [start, forward] = LONG_LIFE_START[dayStem];
  const startIdx = BRANCHES.indexOf(start), bIdx = BRANCHES.indexOf(branch);
  const diff = forward ? (bIdx - startIdx + 12) % 12 : (startIdx - bIdx + 12) % 12;
  return TWELVE_STAGES[diff];
}
// 大運
function calcDaiun(birth, gender, monthP, yearP) {
  const yangStem = STEM_YINYANG[yearP.stemIdx] === '陽';
  const forward = (gender === 'male' && yangStem) || (gender === 'female' && !yangStem);
  const arr = [];
  let stemIdx = monthP.stemIdx, branchIdx = monthP.branchIdx;
  for (let i = 0; i < 8; i++) {
    if (i > 0) {
      if (forward) { stemIdx = (stemIdx + 1) % 10; branchIdx = (branchIdx + 1) % 12; }
      else { stemIdx = (stemIdx + 9) % 10; branchIdx = (branchIdx + 11) % 12; }
    }
    arr.push({
      age: `${i * 10 + 1}-${(i + 1) * 10}`,
      ganzhi: STEMS[stemIdx] + BRANCHES[branchIdx],
      stem: STEMS[stemIdx], branch: BRANCHES[branchIdx],
    });
  }
  return arr;
}

function birthCards(birth) {
  const digits = birth.replace(/-/g, '').split('').map(Number);
  let sum = digits.reduce((a,b) => a+b, 0);
  while (sum > 22) sum = digitSum(sum);
  const personality = sum;
  let soul = sum; while (soul > 9) soul = digitSum(soul);
  return {
    sum: digits.reduce((a,b) => a+b, 0),
    personality, soul,
    personalityCard: BIRTHCARD_NAMES[personality] || `(${personality})`,
    soulCard: BIRTHCARD_NAMES[soul] || `(${soul})`,
  };
}

function castYao(rnd) {
  // 3 coins: heads=3, tails=2; sum 6-9
  let sum = 0; for (let i = 0; i < 3; i++) sum += (rnd() < 0.5 ? 2 : 3);
  return sum;
}
function trigramFromYaos(y1, y2, y3) {
  // y1=初爻, y2=2爻, y3=3爻; bit0=y1, bit1=y2, bit2=y3 (陽=1, 陰=0); 6,8=陰 / 7,9=陽
  const b = (y1 % 2) | ((y2 % 2) << 1) | ((y3 % 2) << 2);
  return b;
}
function hexagramFromYaos(yaos) {
  const lower = trigramFromYaos(yaos[0], yaos[1], yaos[2]);
  const upper = trigramFromYaos(yaos[3], yaos[4], yaos[5]);
  return { num: KING_WEN_TABLE[lower][upper], lower, upper };
}
function todayPersonalHexagram(birth, date) {
  const dt = (date instanceof Date) ? date : parseDate(date);
  const birthSeed = hash(birth);
  const dateSeed = dt.getUTCFullYear()*10000 + (dt.getUTCMonth()+1)*100 + dt.getUTCDate();
  const seed = (birthSeed ^ Math.imul(dateSeed, 2654435761)) >>> 0;
  const rnd = lcgSeed(seed);
  const yaos = [];
  for (let i = 0; i < 6; i++) yaos.push(castYao(rnd));
  const hex = hexagramFromYaos(yaos);
  return { ...hex, yaos };
}

function buildDeck() {
  const deck = [];
  for (let i = 0; i < 22; i++) deck.push({ type:'major', id: i, name: MAJOR_ARCANA[i][0], meaning: MAJOR_ARCANA[i][1], reversed: MAJOR_ARCANA[i][2] });
  for (const [suit, info] of Object.entries(SUITS)) {
    for (let i = 0; i < 14; i++) {
      deck.push({ type:'minor', suit, rank: MINOR_RANKS[i], name: `${suit}の${MINOR_RANKS[i]}`, element: info[0], domain: info[1], color: info[2] });
    }
  }
  return deck;
}
function drawCardsSeeded(n, seed, positions) {
  const deck = buildDeck();
  const rnd = lcgSeed(seed >>> 0);
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  const picks = deck.slice(0, n);
  return picks.map((c, i) => ({ ...c, reversedDraw: rnd() < 0.5, position: positions ? positions[i] : '' }));
}

function pickByDate(arr, date, salt) {
  const dt = (date instanceof Date) ? date : parseDate(date);
  const k = dt.getUTCFullYear()*10000 + (dt.getUTCMonth()+1)*100 + dt.getUTCDate();
  const seed = (k ^ Math.imul(salt, 2654435761)) >>> 0;
  return arr[seed % arr.length];
}

// ============================================================
// AGGREGATE: ALL ENGINES per person × date
// ============================================================
function runEngines(person, dateStr) {
  const date = parseDate(dateStr);
  const yearP = yearPillar(person.birth);
  const monthP = monthPillar(person.birth);
  const dayP = dayPillar(person.birth);
  const hourP = (person.hour != null && person.hour !== '') ? hourPillar(dayP.stem, +person.hour) : null;

  const honmei = honmeiStar(person.birth);
  const getsumei = getsumeiStar(honmei, monthP.branchIdx);
  const dStar = dayStar(date);
  const relation = starRelation(honmei, dStar);

  const lifePath = lifePathNumber(person.birth);
  const bday = birthdayNumber(person.birth);
  const py = personalYear(person.birth, date.getUTCFullYear());
  const pday = personalDay(py, date.getUTCMonth()+1, date.getUTCDate());

  const bcards = birthCards(person.birth);
  const kua = calcKua(person.birth, person.gender || 'male');
  const dirs = dirRatings(kua.kua);

  const [m, d] = [date.getUTCMonth()+1, date.getUTCDate()];
  const sunSign = getSunSign(+person.birth.slice(5,7), +person.birth.slice(8,10));
  const sunLon = sunLongitude(date);
  const moon = moonPhase(date);

  // 今日の節気
  const yearTerms = solarTermsOfYear(date.getUTCFullYear());
  const prevYearTerms = solarTermsOfYear(date.getUTCFullYear()-1);
  const allTerms = [...prevYearTerms, ...yearTerms];
  let curTerm = allTerms[0];
  for (const t of allTerms) { if (t.date <= date) curTerm = t; else break; }
  const nextTerm = allTerms.find(t => t.date > date) || allTerms[allTerms.length-1];

  const todayDayP = dayPillar(dateStr);
  const dayStage = twelveStage(dayP.stem, todayDayP.branch);

  // 今日の干支×本人の通変 (運勢)
  const todayTongbian = tongbianStar(dayP.stemIdx, todayDayP.stemIdx);
  const todayInfo = TONGBIAN_INFO[todayTongbian] || { rank:'中吉', desc:'-' };

  // 大運 (現在何運か)
  const ageNow = date.getUTCFullYear() - parseDate(person.birth).getUTCFullYear();
  const daiun = calcDaiun(person.birth, person.gender || 'male', monthP, yearP);
  daiun.forEach(d => {
    const [a, b] = d.age.split('-').map(Number);
    d.current = ageNow >= a && ageNow <= b;
    d.tongbian = tongbianStar(dayP.stemIdx, STEMS.indexOf(d.stem));
  });

  // 12時辰
  const hourly = todayHourlyChart(date, todayDayP);

  // 易経 (today personal)
  const hex = todayPersonalHexagram(person.birth, date);

  // タロット 3 枚 (過去-現在-未来)
  const tarotSeed = hash(person.id + '|' + dateStr);
  const tarot = drawCardsSeeded(3, tarotSeed, ['過去','現在','未来']);

  // pickByDate
  const pdVariant = pickByDate(PERSONAL_DAY_VARIANTS, date, 101);
  const dColor    = pickByDate(DAY_COLORS,    date, 201);
  const dCaution  = pickByDate(DAY_CAUTIONS,  date, 301);
  const dFood     = pickByDate(DAY_FOODS,     date, 401);
  const dItem     = pickByDate(DAY_ITEMS,     date, 501);
  const dShadow   = pickByDate(SHADOW_BLESSINGS, date, 601);

  // MBTI: 人物固定 or 推定
  const mbti = person.mbti || (person.id === 'yoshida' ? 'INFJ' : inferMBTI(person));

  // スコア算出 (各種要素の総和)
  const bMod = (BLOOD[person.blood] || BLOOD['O']).mod;
  const seed = person.id + '|' + dateStr;
  const baseRng = ((hash(seed) % 10000) / 10000) * 40;
  const compatBonus = relation.score * 6;            // 6-30
  const tongbianBonus = ({'大吉':18,'吉':12,'中吉':6,'注意':-6,'-':0})[todayInfo.rank] || 0;
  const moonBonus = (Math.sin(moon.phase * Math.PI * 2)) * 6;
  const total = Math.max(15, Math.min(99, Math.round(40 + baseRng + compatBonus + tongbianBonus + moonBonus)));

  const work    = Math.max(10, Math.min(99, Math.round(total + ((hash(seed+'w')%2000)/2000 - 0.5)*30 + bMod.work)));
  const social  = Math.max(10, Math.min(99, Math.round(total + ((hash(seed+'s')%2000)/2000 - 0.5)*30 + bMod.social)));
  const health  = Math.max(10, Math.min(99, Math.round(total + ((hash(seed+'h')%2000)/2000 - 0.5)*30 + bMod.health)));
  const money   = Math.max(10, Math.min(99, Math.round(total + ((hash(seed+'m')%2000)/2000 - 0.5)*30 + bMod.money)));

  // 中心人物との相性
  const center = PEOPLE.find(p => p.center) || PEOPLE[0];
  let compatScore = 50;
  if (center && person.id !== center.id) {
    const cHon = honmeiStar(center.birth);
    const rel = starRelation(honmei, cHon);
    const cDay = dayPillar(center.birth);
    const tbMutual = tongbianStar(cDay.stemIdx, dayP.stemIdx);
    const tbBonus = ({'正官':20,'正財':18,'印綬':16,'食神':12,'偏財':10,'比肩':6,'偏官':4,'偏印':2,'傷官':-10,'劫財':-8})[tbMutual] || 0;
    const blood = (BLOOD_COMPAT[person.blood]?.[center.blood]) || 6;
    compatScore = Math.max(10, Math.min(99, Math.round(35 + rel.score * 4 + tbBonus + blood * 2 + ((hash(seed+'c')%2000)/2000 - 0.5) * 15)));
  } else {
    compatScore = 99;
  }

  return {
    person, date, dateStr,
    total, work, social, health, money, compatScore,
    engines: {
      yearP, monthP, dayP, hourP,
      honmei, getsumei, dStar, relation,
      lifePath, bday, py, pday,
      bcards, kua, dirs,
      sunSign, sunLon, moon, curTerm, nextTerm,
      dayStage, todayTongbian, todayInfo,
      daiun, hourly, hex, tarot,
    },
    mbti,
    todayVariant: pdVariant, todayColor: dColor, todayCaution: dCaution,
    todayFood: dFood, todayItem: dItem, shadowBlessing: dShadow,
    advice: chooseAdvice(total, todayInfo.rank),
  };
}

function inferMBTI(person) {
  const types = Object.keys(MBTI_PROFILES);
  return types[hash(person.id) % types.length];
}
function chooseAdvice(total, rank) {
  if (total >= 80 || rank === '大吉') return '今日は大胆に行動してよい。新規提案や重要な打診のチャンス。';
  if (total >= 65) return '集中力が高い日。難しいタスクから着手しよう。';
  if (total >= 50) return '無理せず淡々と。報連相を丁寧に。';
  if (total >= 35) return '一歩引いて全体を俯瞰すると見えてくる。';
  return '重要な意思決定は明日に回そう。体調管理を最優先に。';
}

function scoreColor(s) {
  if (s >= 80) return '#3d5e44';   // 大吉 — 苔
  if (s >= 65) return '#5e7a4f';   // 中の上 — 若苔
  if (s >= 50) return '#8a7240';   // 中 — 黄土
  if (s >= 35) return '#8c5a3a';   // 中の下 — 焦茶
  return '#8c3a3a';                 // 凶 — 朱
}

// ============================================================
// RENDER
// ============================================================
const $date = document.getElementById('dateInput');
const $svg  = document.getElementById('radial');
const $cards = document.getElementById('cards');
const $detailName = document.getElementById('detailName');
let selectedId = (PEOPLE.find(p => p.center) || PEOPLE[0] || {}).id || 'yoshida';
let activeTab = 'overview';

function render() {
  const date = $date.value || todayStr();
  const all = {};
  PEOPLE.forEach(p => all[p.id] = runEngines(p, date));
  drawRadial(date, all);
  drawCards(date, all);
  drawDetail(date, all);
  const dt = parseDate(date);
  const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getUTCDay()];
  const hd = document.getElementById('heroDate');
  if (hd) hd.textContent = `${date} · ${wd}`;
}

function drawRadial(date, all) {
  const NS = 'http://www.w3.org/2000/svg';
  const CX=300, CY=300, R=200;
  $svg.innerHTML = '';
  const center = PEOPLE.find(p => p.center) || PEOPLE[0];
  const others = PEOPLE.filter(p => p.id !== center.id);

  // 七宝-inspired decorative rings (mono)
  for (let i = 0; i < 4; i++) {
    const ring = document.createElementNS(NS, 'circle');
    ring.setAttribute('cx', CX); ring.setAttribute('cy', CY);
    ring.setAttribute('r', 60 + i*50);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', '#cfcdc6');
    ring.setAttribute('stroke-width', i === 1 ? 0.8 : 0.4);
    ring.setAttribute('stroke-dasharray', i === 0 ? '' : '2 4');
    $svg.appendChild(ring);
  }
  // cross lines
  const cross = document.createElementNS(NS, 'g');
  cross.innerHTML = `
    <line x1="${CX-220}" y1="${CY}" x2="${CX+220}" y2="${CY}" stroke="#e4e1d9" stroke-width="0.4"/>
    <line x1="${CX}" y1="${CY-220}" x2="${CX}" y2="${CY+220}" stroke="#e4e1d9" stroke-width="0.4"/>
  `;
  $svg.appendChild(cross);

  others.forEach((p, i) => {
    const angle = (-Math.PI/2) + (i / others.length) * Math.PI * 2;
    const x = CX + Math.cos(angle)*R, y = CY + Math.sin(angle)*R;
    const c = all[p.id].compatScore;
    const link = document.createElementNS(NS, 'line');
    link.setAttribute('x1', CX); link.setAttribute('y1', CY);
    link.setAttribute('x2', x); link.setAttribute('y2', y);
    link.setAttribute('class', 'link');
    link.setAttribute('stroke', scoreColor(c));
    link.setAttribute('stroke-width', 1 + (c/100)*4);
    link.setAttribute('opacity', 0.3 + (c/100)*0.5);
    $svg.appendChild(link);
    const mx = (CX+x)/2, my = (CY+y)/2;
    const lbl = document.createElementNS(NS, 'text');
    lbl.setAttribute('x', mx); lbl.setAttribute('y', my);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('font-size', '10');
    lbl.setAttribute('fill', scoreColor(c));
    lbl.setAttribute('font-weight', '700');
    lbl.textContent = '相性 ' + c;
    $svg.appendChild(lbl);
  });

  drawNode(CX, CY, center, all[center.id], 50, true);
  others.forEach((p, i) => {
    const angle = (-Math.PI/2) + (i / others.length) * Math.PI * 2;
    drawNode(CX + Math.cos(angle)*R, CY + Math.sin(angle)*R, p, all[p.id], 36, false);
  });
}
function drawNode(cx, cy, person, r, radius, isCenter) {
  const NS = 'http://www.w3.org/2000/svg';
  const f = r;
  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('cx', cx); ring.setAttribute('cy', cy);
  ring.setAttribute('r', radius + 6);
  ring.setAttribute('fill', 'none');
  ring.setAttribute('stroke', scoreColor(f.total));
  ring.setAttribute('stroke-width', 3);
  ring.setAttribute('opacity', 0.7);
  $svg.appendChild(ring);

  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', cx); c.setAttribute('cy', cy);
  c.setAttribute('r', radius);
  c.setAttribute('fill', KYUSEI[f.engines.honmei].color);
  c.setAttribute('fill-opacity', 0.25);
  c.setAttribute('stroke', KYUSEI[f.engines.honmei].color);
  c.setAttribute('stroke-width', 2);
  c.setAttribute('class', 'node-circle' + (selectedId === person.id ? ' selected' : ''));
  c.addEventListener('click', () => { selectedId = person.id; render(); });
  $svg.appendChild(c);

  const score = document.createElementNS(NS, 'text');
  score.setAttribute('x', cx); score.setAttribute('y', cy + 5);
  score.setAttribute('class', 'node-score');
  score.style.fontSize = (isCenter ? 22 : 16) + 'px';
  score.textContent = f.total;
  $svg.appendChild(score);

  const name = document.createElementNS(NS, 'text');
  name.setAttribute('x', cx); name.setAttribute('y', cy + radius + 22);
  name.setAttribute('class', 'node-label');
  name.textContent = person.name + (isCenter ? '（中心）' : '');
  $svg.appendChild(name);

  const sub = document.createElementNS(NS, 'text');
  sub.setAttribute('x', cx); sub.setAttribute('y', cy + radius + 36);
  sub.setAttribute('class', 'node-sub');
  sub.textContent = KYUSEI[f.engines.honmei].name + ' / ' + f.engines.dayP.ganzhi;
  $svg.appendChild(sub);
}

function drawCards(date, all) {
  $cards.innerHTML = '';
  PEOPLE.forEach(p => {
    const f = all[p.id];
    const card = document.createElement('div');
    card.className = 'card' + (selectedId === p.id ? ' selected' : '');
    card.innerHTML = `
      <div class="card-head">
        <div>
          <span class="card-name">${p.name}</span>
          <span class="card-role">${p.role || ''}</span>
        </div>
        <div class="card-score" style="color:${scoreColor(f.total)}">${f.total}</div>
      </div>
      <div class="bars">
        ${bar('仕事', f.work)}${bar('対人', f.social)}${bar('健康', f.health)}${bar('金運', f.money)}
      </div>
      <div class="card-foot">
        ${KYUSEI[f.engines.honmei].name} / ${f.engines.dayP.ganzhi} / ${p.blood||'?'}型 ・ 今日「${f.engines.todayTongbian}」
      </div>
    `;
    card.addEventListener('click', () => { selectedId = p.id; render(); });
    $cards.appendChild(card);
  });
}
function bar(label, v) {
  return `<div class="bar"><span>${label}</span><div class="bar-track"><div class="bar-fill" style="width:${v}%;background:${scoreColor(v)}"></div></div><span class="bar-val">${v}</span></div>`;
}

function moonSvg(phase) {
  const W = 180, H = 180, R = 78;
  const k = Math.cos(phase * Math.PI * 2);
  const shadow = '#1a1a1f', light = '#f4f2ec', edge = '#15151a';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:180px;height:180px">
    <circle cx="${W/2}" cy="${H/2}" r="${R}" fill="${light}"/>
    <ellipse cx="${W/2 + k*R}" cy="${H/2}" rx="${Math.abs(k)*R}" ry="${R}" fill="${shadow}"/>
    ${phase < 0.5 ? `<rect x="${W/2}" y="${H/2-R}" width="${R}" height="${R*2}" fill="${shadow}"/>` : `<rect x="${W/2-R}" y="${H/2-R}" width="${R}" height="${R*2}" fill="${shadow}"/>`}
    <circle cx="${W/2}" cy="${H/2}" r="${R}" fill="none" stroke="${edge}" stroke-width="1"/>
  </svg>`;
}

function compassSvg(dirs) {
  const W=320, H=320, CX=W/2, CY=H/2, R=130, IR=60;
  const order = ['北','東北','東','東南','南','西南','西','西北'];
  const segments = order.map((dir, i) => {
    const a0 = (-Math.PI/2) + (i - 0.5)/8 * Math.PI*2;
    const a1 = (-Math.PI/2) + (i + 0.5)/8 * Math.PI*2;
    const x0o = CX + Math.cos(a0)*R, y0o = CY + Math.sin(a0)*R;
    const x1o = CX + Math.cos(a1)*R, y1o = CY + Math.sin(a1)*R;
    const x0i = CX + Math.cos(a0)*IR, y0i = CY + Math.sin(a0)*IR;
    const x1i = CX + Math.cos(a1)*IR, y1i = CY + Math.sin(a1)*IR;
    const rate = dirs[dir] || '-';
    const c = (DIR_RANK[rate] || ['','#666',''])[1];
    const am = (a0+a1)/2;
    const lx = CX + Math.cos(am)*(R+IR)/2, ly = CY + Math.sin(am)*(R+IR)/2;
    const labelX = CX + Math.cos(am)*(R+18), labelY = CY + Math.sin(am)*(R+18) + 4;
    return `<path d="M${x0i},${y0i} L${x0o},${y0o} A${R},${R} 0 0,1 ${x1o},${y1o} L${x1i},${y1i} A${IR},${IR} 0 0,0 ${x0i},${y0i} Z" fill="${c}" fill-opacity="0.35" stroke="#15151a" stroke-width="0.7"/>
      <text x="${lx}" y="${ly+3}" text-anchor="middle" font-size="10" fill="#15151a" font-weight="500" style="font-family:'Hiragino Mincho ProN',serif">${rate}</text>
      <text x="${labelX}" y="${labelY}" text-anchor="middle" font-size="13" fill="#15151a" font-weight="500" style="font-family:'Hiragino Mincho ProN',serif">${dir}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:300px;height:300px">${segments}
    <circle cx="${CX}" cy="${CY}" r="${IR-2}" fill="#ffffff" stroke="#15151a" stroke-width="1"/>
    <text x="${CX}" y="${CY+5}" text-anchor="middle" font-size="13" fill="#15151a" font-weight="500" style="font-family:'Hiragino Mincho ProN',serif">中心</text>
  </svg>`;
}

// ============================================================
// MODAL (registration)
// ============================================================
const $modal = document.getElementById('modal');
const $manageBtn = document.getElementById('manageBtn');
const $closeBtn = document.getElementById('closeBtn');
const $form = document.getElementById('regForm');
const $fId = document.getElementById('fId');
const $fName = document.getElementById('fName');
const $fRole = document.getElementById('fRole');
const $fBirth = document.getElementById('fBirth');
const $fHour = document.getElementById('fHour');
const $fGender = document.getElementById('fGender');
const $fCenter = document.getElementById('fCenter');
const $modalTitle = document.getElementById('modalTitle');
const $submitBtn = document.getElementById('submitBtn');
const $deleteBtn = document.getElementById('deleteBtn');
const $resetFormBtn = document.getElementById('resetFormBtn');
const $resetAllBtn = document.getElementById('resetAllBtn');
const $peopleList = document.getElementById('peopleList');

function openModal() { $modal.classList.add('open'); resetForm(); renderPeopleList(); }
function closeModal() { $modal.classList.remove('open'); }
$manageBtn.addEventListener('click', openModal);
$closeBtn.addEventListener('click', closeModal);
$modal.addEventListener('click', e => { if (e.target === $modal) closeModal(); });

function resetForm() {
  $fId.value = ''; $fName.value = ''; $fRole.value = ''; $fBirth.value = '';
  $fHour.value = ''; $fGender.value = 'male'; $fCenter.checked = false;
  document.querySelectorAll('input[name=blood]').forEach(r => r.checked = false);
  $modalTitle.textContent = '人物の登録';
  $submitBtn.textContent = '登録する';
  $deleteBtn.style.display = 'none';
}
$resetFormBtn.addEventListener('click', resetForm);
function loadForm(p) {
  $fId.value = p.id; $fName.value = p.name; $fRole.value = p.role || '';
  $fBirth.value = p.birth; $fHour.value = p.hour != null ? p.hour : '';
  $fGender.value = p.gender || 'male'; $fCenter.checked = !!p.center;
  document.querySelectorAll('input[name=blood]').forEach(r => r.checked = (r.value === p.blood));
  $modalTitle.textContent = `「${p.name}」を編集`;
  $submitBtn.textContent = '更新する';
  $deleteBtn.style.display = '';
}
$form.addEventListener('submit', e => {
  e.preventDefault();
  const name = $fName.value.trim(), birth = $fBirth.value;
  if (!name || !birth) return;
  const blood = (document.querySelector('input[name=blood]:checked') || {}).value || 'O';
  const id = $fId.value || ('p' + Date.now().toString(36));
  const isCenter = $fCenter.checked;
  const hourVal = $fHour.value === '' ? null : Math.max(0, Math.min(23, +$fHour.value));
  const data = { id, name, role: $fRole.value.trim(), birth, hour: hourVal, gender: $fGender.value, blood, center: isCenter };
  const idx = PEOPLE.findIndex(p => p.id === id);
  if (idx >= 0) PEOPLE[idx] = data; else PEOPLE.push(data);
  if (isCenter) PEOPLE.forEach(p => { if (p.id !== id) p.center = false; });
  if (!PEOPLE.some(p => p.center)) PEOPLE[0].center = true;
  savePeople(); resetForm(); renderPeopleList();
  selectedId = id; render();
});
$deleteBtn.addEventListener('click', () => {
  const id = $fId.value; if (!id) return;
  if (!confirm('この人物を削除しますか？')) return;
  PEOPLE = PEOPLE.filter(p => p.id !== id);
  if (!PEOPLE.some(p => p.center) && PEOPLE.length) PEOPLE[0].center = true;
  savePeople(); resetForm(); renderPeopleList();
  if (selectedId === id) selectedId = (PEOPLE[0]||{}).id || '';
  render();
});
$resetAllBtn.addEventListener('click', () => {
  if (!confirm('全データをサンプルに戻しますか？')) return;
  PEOPLE = DEFAULT_PEOPLE.slice();
  savePeople(); resetForm(); renderPeopleList();
  selectedId = 'yoshida'; render();
});
function renderPeopleList() {
  $peopleList.innerHTML = '';
  if (!PEOPLE.length) { $peopleList.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px">登録された人物はいません</div>'; return; }
  PEOPLE.forEach(p => {
    const row = document.createElement('div');
    row.className = 'person-row';
    row.innerHTML = `
      <div>
        <div>${p.name} ${p.center ? '<span class="center-badge">中心</span>' : ''}</div>
        <div class="meta">${p.role || '—'} ・ ${p.birth}${p.hour!=null?` ${p.hour}時`:''} ・ ${p.gender==='female'?'女':'男'} ・ ${p.blood || '?'}型</div>
      </div>
      <button class="ico-btn" data-act="edit" title="編集">✎</button>
      <button class="ico-btn" data-act="del"  title="削除">🗑</button>
    `;
    row.querySelector('[data-act=edit]').addEventListener('click', () => loadForm(p));
    row.querySelector('[data-act=del]').addEventListener('click', () => {
      if (!confirm(`「${p.name}」を削除しますか？`)) return;
      PEOPLE = PEOPLE.filter(x => x.id !== p.id);
      if (!PEOPLE.some(x => x.center) && PEOPLE.length) PEOPLE[0].center = true;
      savePeople(); renderPeopleList();
      if (selectedId === p.id) selectedId = (PEOPLE[0]||{}).id || '';
      render();
    });
    $peopleList.appendChild(row);
  });
}

// ============================================================
// INIT
// ============================================================
$date.value = todayStr();
$date.addEventListener('change', render);
document.getElementById('todayBtn').addEventListener('click', () => { $date.value = todayStr(); render(); });
if (!PEOPLE.find(p => p.id === selectedId)) selectedId = (PEOPLE.find(p => p.center) || PEOPLE[0] || {}).id || '';
render();
</script>
